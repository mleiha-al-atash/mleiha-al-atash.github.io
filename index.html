<!doctype html>
<html lang="ar" dir="rtl" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="مليحة العطش: قرية في محافظة درعا، جنوب سوريا. صور وحكايات ومعلومات عنها. / Muleiha Al-Atash: a village in Daraa, southern Syria.">
<title>مليحة العطش — درعا، سوريا</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌾%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap"></noscript>
<style>
:root{
  --bg1:#d9a62e; --fg1:#1c1d1a;
  --bg2:#1c1d1a; --fg2:#f5f3ee;
  --bg3:#ecebe6; --fg3:#1c1d1a;
  --display:"Lalezar","Cairo","Tajawal",Impact,sans-serif;
  --display-lat:"Anton","Lalezar",Impact,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --pad:clamp(20px,4vw,64px);
  --ease:cubic-bezier(.2,.7,.2,1);
  --ui:#161614; --ui-fg:#f5f3ee;
  --r:14px; --btn-r:999px; --space:1; --scale:1; --tscale:1; --dir:1;
  --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:var(--nav-h);-webkit-text-size-adjust:100%}
html[dir="ltr"]{--dir:-1}
html.loading,html.loading body,html.modal,html.modal body,html.menuopen,html.menuopen body{overflow:hidden}
body{
  margin:0;background:var(--bg1);color:var(--fg1);
  font-family:var(--body);font-size:calc(clamp(1rem,.9rem + .5vw,1.2rem) * var(--scale));line-height:1.7;
  overflow-x:hidden;
}
a{color:inherit}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid currentColor;outline-offset:4px}
[data-path]{white-space:pre-line}
img{max-width:100%}

.spin{animation:spin 3.2s cubic-bezier(.6,0,.4,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:100;background:var(--bg2);color:var(--fg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4vw,48px);transition:transform 1s cubic-bezier(.76,0,.24,1)}
.loader.done{transform:translateY(-100%)}
.loader-row{display:flex;align-items:center;gap:clamp(10px,3vw,40px);font-family:var(--display);font-size:min(20vw,13rem);line-height:1.1}
html[lang="en"] .loader-row{font-family:var(--display-lat);font-size:min(13vw,9rem);text-transform:uppercase}
.loader-row svg{width:.8em;height:.8em;flex:none;color:var(--bg1)}
.count{font-size:.95rem;opacity:.7}

/* ---------- flag ---------- */
.flag-svg{display:block;width:100%;height:100%}
.flag-ico{display:inline-block;width:30px;height:20px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.flag-wave{position:absolute;z-index:2;inset-block-start:calc(var(--nav-h) + 22px);inset-inline-end:var(--pad);width:clamp(64px,9vw,110px);aspect-ratio:3/2;transform-origin:left center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));animation:wave 4.2s ease-in-out infinite alternate}
@keyframes wave{from{transform:perspective(500px) rotateY(-14deg) skewY(2deg)}to{transform:perspective(500px) rotateY(10deg) skewY(-2deg)}}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;inset-inline:0;z-index:20;height:var(--nav-h);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 var(--pad);background:var(--bg1);color:var(--fg1);box-shadow:0 1px 0 color-mix(in srgb,var(--fg1) 18%,transparent)}
html.hasflag .nav::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(#007a3d 0 33.4%,#fff 33.4% 66.7%,#000 66.7%)}
html.hasflag .nav{padding-top:6px}
.nav a,.nav button{text-decoration:none}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(1.25rem,4vw,1.7rem);line-height:1;white-space:nowrap}
html[lang="en"] .logo{font-family:var(--display-lat);font-size:clamp(1.1rem,3.4vw,1.45rem);letter-spacing:.04em;text-transform:uppercase}
.logo svg.spin{width:.8em;height:.8em;flex:none}
.nav-r{display:flex;align-items:center;gap:clamp(8px,2vw,22px)}
.nav ul{display:none;gap:clamp(14px,2vw,30px);list-style:none;margin:0;padding:0;font-weight:500;font-size:1rem;white-space:nowrap}
@media (min-width:1000px){.nav ul{display:flex}.menu-btn{display:none!important}}
.nav.compact ul{display:none}
.nav.compact .menu-btn{display:grid!important}
.nav-btn{min-width:44px;height:40px;padding:0 12px;border:2px solid currentColor;border-radius:var(--btn-r);background:none;color:inherit;font-size:.95rem;font-weight:700;cursor:pointer}
.menu-btn{display:grid;place-items:center;width:44px;height:40px;padding:0;border:2px solid currentColor;border-radius:var(--btn-r);background:none;color:inherit;cursor:pointer}
.menu-btn svg{width:22px;height:22px}
.menu{position:fixed;inset:0;z-index:90;background:var(--bg2);color:var(--fg2);display:flex;flex-direction:column;padding:calc(var(--nav-h) + 20px) var(--pad) 32px;overflow:auto;transform:translateY(-100%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
html.menuopen .menu{transform:none;visibility:visible;transition:transform .5s var(--ease)}
.menu a{display:block;font-family:var(--display);font-size:clamp(2.4rem,9vw,4.5rem);line-height:1.25;text-decoration:none;border-bottom:1px solid color-mix(in srgb,currentColor 25%,transparent);padding:6px 0}
html[lang="en"] .menu a{font-family:var(--display-lat);text-transform:uppercase}
.menu-x{position:absolute;inset-block-start:calc(6px + 10px);inset-inline-end:var(--pad);width:44px;height:40px;border:2px solid currentColor;border-radius:var(--btn-r);background:none;color:inherit;font-size:1.4rem;line-height:1;cursor:pointer}
.cfgwarn{position:fixed;inset-inline:0;top:var(--nav-h);z-index:15;background:#b3261e;color:#fff;padding:8px var(--pad);font-size:.9rem;text-align:center}

/* ---------- sections ---------- */
.sec{padding:calc(clamp(72px,12vw,180px) * var(--space)) var(--pad)}
.s-bg1{--sbg:var(--bg1);--sfg:var(--fg1);background:var(--bg1);color:var(--fg1)}
.s-bg2{--sbg:var(--bg2);--sfg:var(--fg2);background:var(--bg2);color:var(--fg2)}
.s-bg3{--sbg:var(--bg3);--sfg:var(--fg3);background:var(--bg3);color:var(--fg3)}
.al-center{text-align:center}
.al-center .sec-lead,.al-center .map-text{margin-inline:auto}
.sec-title{font-family:var(--display);font-weight:400;font-size:clamp(3rem,9vw,9rem);line-height:1.1;margin:0 0 clamp(32px,5vw,72px)}
html[lang="en"] .sec-title{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(2.6rem,7.5vw,7rem);letter-spacing:.01em}
.ts-s .sec-title{font-size:clamp(2rem,5vw,4.5rem)}
.ts-l .sec-title{font-size:clamp(3.6rem,12vw,12rem)}
html[lang="en"] .ts-s .sec-title{font-size:clamp(1.8rem,4.5vw,4rem)}
html[lang="en"] .ts-l .sec-title{font-size:clamp(3rem,10vw,10rem)}
.sub-title{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,4rem);line-height:1.2;margin:0 0 clamp(16px,2vw,28px)}
html[lang="en"] .sub-title{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.6rem,4vw,3.2rem)}
.sec-lead{margin:0 0 clamp(20px,3vw,36px);max-width:40em;font-size:1.15em;opacity:.9}
.empty{margin:0;font-size:1.2em;opacity:.75}
.note{font-size:.9rem;opacity:.75;margin:14px 0 0}
.ow-hint{border:2px dashed currentColor;border-radius:var(--r);padding:14px 18px;margin:0 0 20px;font-size:.95rem;opacity:.8}

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;justify-content:var(--hv,flex-end);align-items:var(--hh,flex-start);padding:calc(var(--nav-h) + var(--pad) * 1.6) var(--pad) var(--pad);background:var(--bg1);color:var(--fg1);text-align:var(--ha,start)}
.hero.h-tall{min-height:78svh}.hero.h-half{min-height:56svh}
.hero.has-cover{color:#fff}
.cover{position:absolute;inset:0;z-index:-1;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.cover img.on{opacity:1}
.cover::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dark,.4))}
.hero-in{position:relative;width:100%;max-width:100%}
.hero h1{font-family:var(--display);font-weight:400;font-size:min(26vw,30svh);line-height:.95;margin:0 0 clamp(14px,2vw,26px)}
html[lang="en"] .hero h1{font-family:var(--display-lat);text-transform:uppercase;font-size:min(16vw,30svh);line-height:.98;letter-spacing:.01em}
.hero.t-outline h1{color:transparent;-webkit-text-stroke:max(2px,.012em) var(--fg1)}
.hero.t-outline.has-cover h1{-webkit-text-stroke-color:#fff}
.hero.has-cover h1{text-shadow:0 2px 28px rgba(0,0,0,.3)}
.hero.t-outline.has-cover h1{text-shadow:none}
.line{display:block;overflow:hidden;padding-block:.14em;margin-block:-.14em}
.line>span{display:inline-block;vertical-align:top;white-space:nowrap;transform:translateY(115%);transition:transform 1.1s cubic-bezier(.16,.84,.24,1)}
.line:nth-child(2)>span{transition-delay:.12s}
html.ready .line>span{transform:none}
.brand2{display:flex;align-items:center;gap:14px;margin:0 0 clamp(22px,4vw,56px);font-family:var(--display-lat);font-size:clamp(1rem,3.2vw,2.2rem);letter-spacing:.34em;text-transform:uppercase;line-height:1.2}
html[lang="en"] .brand2{font-family:var(--display);letter-spacing:0;text-transform:none;font-size:clamp(1.4rem,4.4vw,3rem)}
.brand2 i{display:block;height:2px;width:clamp(28px,7vw,90px);background:currentColor;flex:none}
.hero.h-cn .brand2{justify-content:center}
.hero-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;width:100%}
.hero.h-cn .hero-meta{justify-content:center;flex-direction:column;align-items:center}
.hero-meta p{margin:0;max-width:34ch}
.scroll{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none}
.scroll svg{width:28px;height:28px}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1fr;gap:clamp(40px,6vw,96px)}
@media (min-width:900px){.about-grid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.statement{font-size:clamp(1.7rem,4.3vw,3.9rem);line-height:1.4;font-weight:500;margin:0;max-width:22em}
.facts{margin:0;align-self:end}
.facts>div{border-top:1px solid color-mix(in srgb,currentColor 35%,transparent);padding:16px 0}
.facts dt{font-size:.85em;opacity:.65}
.facts dd{margin:4px 0 0;font-weight:600;font-size:1.1em}
.qa{margin-top:clamp(56px,8vw,120px)}
.qa-edit{border-top:2px solid currentColor;padding:18px 0}
.qa-edit .proj-name{font-size:clamp(1.6rem,4vw,3rem)}
.qa-edit p{margin:8px 0 14px;max-width:40ch}

/* accordion */
.proj{border-top:2px solid currentColor}
.proj:last-child{border-bottom:2px solid currentColor}
.proj-btn{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer;display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding:clamp(14px,2vw,28px) 0}
.proj-name{flex:1;font-family:var(--display);font-size:clamp(1.9rem,5.2vw,4.4rem);line-height:1.2;transition:transform .35s var(--ease)}
html[lang="en"] .proj-name{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.5rem,4vw,3.3rem)}
.proj-btn:hover .proj-name,.proj-btn:focus-visible .proj-name{transform:translateX(calc(var(--dir) * -2vw))}
.plus{width:clamp(20px,3vw,36px);height:clamp(20px,3vw,36px);flex:none;transition:transform .4s var(--ease)}
.proj.open .plus{transform:rotate(45deg)}
.proj-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.proj.open .proj-panel{grid-template-rows:1fr}
.proj-body{overflow:hidden;min-height:0}
.proj-body p{margin:0 0 clamp(24px,3vw,48px);max-width:36ch;font-size:1.2em}

/* ---------- tabs / tags ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 clamp(24px,4vw,48px)}
.tabs button{font-weight:600;font-size:1rem;padding:8px 18px;border:2px solid currentColor;border-radius:var(--btn-r);background:none;color:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--sfg);color:var(--sbg)}
.tag{display:inline-block;padding:0 10px;border:1.5px solid currentColor;border-radius:var(--btn-r);font-size:.8rem;font-weight:600;line-height:1.7}
.tag.solid{background:var(--sfg);color:var(--sbg);border-color:var(--sfg)}
.pm{margin-inline-start:6px}

/* ---------- featured ---------- */
.feat-grid{display:grid;gap:clamp(14px,2vw,24px);grid-template-columns:1fr}
@media (min-width:800px){.feat-grid{grid-template-columns:repeat(3,1fr)}.feat-grid .fc:first-child{grid-column:span 2;grid-row:span 2}}
.fc{position:relative;display:flex;flex-direction:column;border:2px solid currentColor;border-radius:var(--r);overflow:hidden;background:none;color:inherit;text-align:start;padding:0;cursor:pointer;font:inherit}
.fc-img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:color-mix(in srgb,currentColor 12%,transparent)}
.fc:first-child .fc-img{aspect-ratio:16/11}
.fc-ph{display:grid;place-items:center;aspect-ratio:16/10;background:color-mix(in srgb,currentColor 10%,transparent)}
.fc-ph svg{width:22%;opacity:.4}
.fc-body{display:block;padding:clamp(14px,2vw,22px)}
.fc-title{display:block;font-family:var(--display);font-size:clamp(1.5rem,3vw,2.6rem);line-height:1.2;margin:8px 0 6px}
html[lang="en"] .fc-title{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.3rem,2.6vw,2.2rem)}
.fc:first-child .fc-title{font-size:clamp(1.9rem,4vw,3.6rem)}
.fc-ex{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:.95rem;opacity:.85}

/* ---------- stories ---------- */
.post{border-top:2px solid currentColor}
.post-list .post:last-child{border-bottom:2px solid currentColor}
.post-btn{width:100%;display:flex;align-items:center;gap:clamp(14px,2vw,28px);padding:clamp(14px,2vw,26px) 0;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer}
.post-thumb{width:clamp(64px,10vw,110px);aspect-ratio:1;object-fit:cover;flex:none;border-radius:var(--r)}
.post-text{flex:1;display:block}
.post-title{display:block;font-family:var(--display);font-size:clamp(1.8rem,4.8vw,3.8rem);line-height:1.2;transition:transform .35s var(--ease)}
html[lang="en"] .post-title{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.4rem,3.6vw,2.8rem)}
.post-btn:hover .post-title,.post-btn:focus-visible .post-title{transform:translateX(calc(var(--dir) * -2vw))}
.post-meta{display:block;margin-top:6px;font-size:.9rem}
.row-tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 16px}
.pending-box{margin:0 0 clamp(32px,5vw,56px);padding:clamp(16px,3vw,28px);border:2px dashed currentColor;border-radius:var(--r)}
.pending-box .sub-title{font-size:clamp(1.6rem,4vw,2.6rem)}
.pending-box .post-title{font-size:clamp(1.4rem,3.4vw,2.4rem)}

/* people cards */
.people{display:grid;gap:clamp(12px,2vw,22px);grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.people{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.people{grid-template-columns:repeat(4,1fr)}}
.person{border:2px solid currentColor;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.person-btn{display:block;padding:0;border:0;background:none;color:inherit;text-align:center;cursor:pointer;font:inherit}
.person-img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .4s}
.person-btn:hover .person-img,.person-btn:focus-visible .person-img{filter:none}
.person-ph{display:grid;place-items:center;aspect-ratio:4/5;background:color-mix(in srgb,currentColor 10%,transparent)}
.person-ph svg{width:30%;opacity:.35}
.person-name{display:block;padding:12px 10px 2px;font-family:var(--display);font-size:clamp(1.3rem,2.4vw,1.9rem);line-height:1.25}
html[lang="en"] .person-name{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.1rem,2vw,1.6rem)}
.person-dates{display:block;padding:0 10px 12px;font-size:.9rem;opacity:.8}
.person .row-tools{padding:0 10px 12px;justify-content:center}

/* ---------- photos / video ---------- */
.masonry{columns:2;column-gap:clamp(10px,1.6vw,20px)}
@media (min-width:800px){.masonry{columns:3}}
.ph{break-inside:avoid;margin:0 0 clamp(10px,1.6vw,20px);position:relative}
.ph-btn{position:relative;display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:var(--r);overflow:hidden;color:inherit}
.ph-btn img{display:block;width:100%;height:auto}
.ph-vph{display:grid;place-items:center;aspect-ratio:16/9;background:color-mix(in srgb,currentColor 16%,transparent)}
.ph-play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.ph-play span{display:grid;place-items:center;width:clamp(48px,7vw,72px);aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.ph-play svg{width:42%;margin-inline-start:6%}
.ph figcaption{margin-top:6px;font-size:.9rem;opacity:.85}
.ph-empty{display:grid;place-items:center;background:color-mix(in srgb,currentColor 14%,transparent);break-inside:avoid;margin:0 0 clamp(10px,1.6vw,20px);border-radius:var(--r)}
.ph-empty svg{width:22%;opacity:.5}
.ph-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ---------- map ---------- */
.s-map{padding:0}
.map-shell{position:relative}
#mapbox{position:relative;height:min(84svh,760px);min-height:420px;overflow:hidden;isolation:isolate;background:color-mix(in srgb,var(--bg1) 75%,#fff);direction:ltr;touch-action:pan-x pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
#mapbox.drag{cursor:grabbing}
.mm-tiles{position:absolute;inset:0;overflow:hidden}
.map-duo .mm-tiles{mix-blend-mode:multiply;filter:grayscale(1) contrast(1.15)}
.map-mono .mm-tiles{filter:grayscale(1) contrast(1.05)}
.map-sat .mm-tiles{mix-blend-mode:normal;filter:none}
.mm-tile{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;opacity:0;transition:opacity .25s;-webkit-user-drag:none;pointer-events:none}
.mm-tile.in{opacity:1}
.mm-vig{position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 90px color-mix(in srgb,var(--bg2) 38%,transparent)}
.mm-pin,.mm-poi{position:absolute;left:0;top:0;width:0;height:0;z-index:2}
.mm-pin{pointer-events:none}
.pin-ring,.pin-dot{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%}
.pin-ring{border:2px solid var(--bg2);animation:ring 2.4s ease-out infinite}
.pin-dot{background:var(--bg2);color:var(--bg1);display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.4);border:3px solid var(--bg1)}
.pin-dot svg{width:56%;height:56%}
.pin-label{position:absolute;left:0;bottom:32px;transform:translateX(-50%);white-space:nowrap;direction:rtl;font-family:var(--display);font-size:1.3rem;line-height:1.4;padding:0 16px;background:var(--bg2);color:var(--fg2);box-shadow:0 3px 12px rgba(0,0,0,.3);border-radius:var(--r)}
html[lang="en"] .pin-label{direction:ltr;font-family:var(--display-lat);text-transform:uppercase;letter-spacing:.06em;font-size:1.1rem}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(2);opacity:0}}

  function star(cx,cy,r){var p=[];for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.382:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return'<polygon points="'+p.join(' ')+'" fill="#ce1126"/>'}
  return'<svg class="'+(cls||'flag-svg')+'" viewBox="0 0 300 200" preserveAspectRatio="none" role="img" aria-label="'+(lang==='ar'?'علم سوريا':'Flag of Syria')+'"><rect width="300" height="67" fill="#007a3d"/><rect y="66.7" width="300" height="66.7" fill="#fff"/><rect y="133.3" width="300" height="67" fill="#000"/>'+star(90,100,21)+star(150,100,21)+star(210,100,21)+'</svg>';
}
function dig(s){s=String(s==null?'':s);return lang==='ar'?s.replace(/\d/g,function(d){return'٠١٢٣٤٥٦٧٨٩'[d]}):s}
function ea(path,ph,line,isTx){return ui.edit?(' data-path="'+path+'" data-ph="'+esc(ph)+'"'+(line?' data-line':'')+(isTx?' data-tx':'')):''}

/* ---------- content helpers ---------- */
function catOf(id){return site.cats.filter(function(c){return c.id===id})[0]}
function pTitle(p){return tx(p.title)}
function pBody(p){return tx(p.body)}
function excerpt(p,n){var s=String(pBody(p)||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n).replace(/\s+\S*$/,'')+'…':s}
function approved(){return posts.filter(function(p){return p.status==='approved'})}
function shown(){return ui.edit?posts.filter(function(p){return p.status==='approved'||p.status==='draft'}):approved()}
function pendingPosts(){return(ui.admin&&ui.edit)?posts.filter(function(p){return p.status==='pending'}):[]}
function pendingReviews(){return(ui.admin&&ui.edit)?reviews.filter(function(r){return r.status==='pending'}):[]}
function sortPosts(list){
  return list.slice().sort(function(a,b){
    if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;
    var x=(a.date||'')+(a.time||''),y=(b.date||'')+(b.time||'');
    if(x!==y)return x<y?1:-1;
    return(a.created||'')<(b.created||'')?1:-1;
  });
}
function lifeLine(p){
  var a=yearOf(p.extra&&p.extra.born),b=yearOf(p.date);
  if(a&&b)return dig(a)+' – '+dig(b);
  return dig(b||a||'');
}
function postMeta(p){
  var c=catOf(p.cat),h='<span class="tag">'+esc(c?tx(c.one):p.cat)+'</span>';
  if(p.pinned)h+=' <span class="tag solid">'+t('pinned')+'</span>';
  if(p.status==='pending')h+=' <span class="tag">'+t('pending')+'</span>';
  if(p.status==='draft')h+=' <span class="tag">'+t('draft')+'</span>';
  if(c&&c.kind==='event'&&p.date&&p.date>=todayISO()&&p.status==='approved')h+=' <span class="tag">'+t('upcoming')+'</span>';
  var bits=[];
  if(c&&c.kind==='people'){var ll=lifeLine(p);if(ll)bits.push(ll);if(p.place)bits.push(p.place)}
  else{if(p.date)bits.push(fdate(p.date));if(p.time)bits.push(ftime(p.time));if(p.place)bits.push(p.place)}
  if(p.author)bits.push(t('by')+' '+p.author);
  return h+(bits.length?'<span class="pm">'+bits.map(esc).join(lang==='ar'?'، ':', ')+'</span>':'');
}

/* ---------- navigation ---------- */
function secIndex(id){var r=-1;site.sections.forEach(function(s,i){if(s.id===id)r=i});return r}
function titleOf(s){
  if(s.id.indexOf('blk_')===0){var b=site.blocks.filter(function(x){return'blk_'+x.id===s.id})[0];return b?tx(b.title):''}
  var c=s.title&&s.title[lang];
  if(c)return c;
  var d=SECDEF[s.id];return d?d.t[lang]:'';
}
function featuredList(){return sortPosts(approved().filter(function(p){return p.pinned})).slice(0,4)}
function navItems(){
  var out=[];
  site.sections.forEach(function(s){
    if(!s.on||s.id==='hero')return;
    if(s.id==='featured'&&!featuredList().length)return;
    var d=SECDEF[s.id];
    if(d&&!d.nav)return;
    var ti=titleOf(s);
    if(s.id==='about')ti=lang==='ar'?'عنّا':'About';
    if(s.id==='contact')ti=ti.replace(/[.。]$/,'');
    if(ti)out.push({id:s.id,t:ti});
  });
  return out;
}
function navHTML(){
  var items=navItems(),li=items.map(function(x){return'<li><a href="#'+esc(x.id)+'">'+esc(x.t)+'</a></li>'}).join('');
  var menu=items.map(function(x){return'<a href="#'+esc(x.id)+'" data-act="menu-go">'+esc(x.t)+'</a>'}).join('');
  var short=lang==='ar'?site.brand.ar:site.brand.en;
  return(CONFIGURED?'':'<div class="cfgwarn">الموقع غير مربوط بقاعدة البيانات بعد: ضع رابط المشروع والمفتاح أعلى ملف index.html.</div>')+
    '<header class="nav"><a class="logo" href="#top">'+STAR+'<span>'+esc(short)+'</span></a><div class="nav-r"><nav aria-label="'+t('menu')+'"><ul>'+li+'</ul></nav>'+
    (site.design.flagBar?'<span class="flag-ico">'+flagSVG()+'</span>':'')+
    '<button class="nav-btn" data-act="lang" aria-label="'+esc(t('lang_label'))+'">'+t('lang_btn')+'</button>'+
    '<button class="menu-btn" data-act="menu" aria-label="'+t('menu')+'">'+MENU+'</button></div></header>'+
    '<div class="menu" id="menu" role="dialog" aria-label="'+t('menu')+'"><button class="menu-x" data-act="menu-close" aria-label="'+t('close')+'">×</button>'+menu+'</div>';
}
function footHTML(){
  var em=safeUrl(site.emblem);
  return'<footer class="foot"><div class="foot-l">'+(site.design.flagFoot?'<span class="flag-ico">'+flagSVG()+'</span>':'')+(em?'<img class="emblem" alt="" src="'+em+'">':'')+
    '<span>'+esc(t('footer_note'))+'</span></div>'+(CONFIGURED&&!ui.admin?'<button class="linkbtn" data-act="login">'+t('owner_login')+'</button>':'')+'</footer>';
}

/* ---------- section shells ---------- */
function secOpen(s,extra){
  var cls='sec s-bg'+s.bg+(s.align==='center'?' al-center':'')+(s.ts==='s'?' ts-s':s.ts==='l'?' ts-l':'')+(extra?' '+extra:'');
  return'<section class="'+cls+'" id="'+esc(s.id)+'" data-sec="'+esc(s.id)+'">';
}
function secTitle(s,cls){
  var i=secIndex(s.id);
  if(s.id.indexOf('blk_')===0){
    var j=-1;site.blocks.forEach(function(b,k){if('blk_'+b.id===s.id)j=k});
    return'<h2 class="sec-title"'+ea('blocks.'+j+'.title','عنوان القسم',1,1)+'>'+esc(titleOf(s))+'</h2>';
  }
  return'<h2 class="'+(cls||'sec-title')+'"'+ea('sections.'+i+'.title','عنوان القسم',1,1)+'>'+esc(titleOf(s))+'</h2>';
}

/* ---------- hero ---------- */

  var d=site.design,covs=site.cover.imgs.map(safeUrl).filter(Boolean);
  var primary=lang==='ar'?site.brand.ar:site.brand.en,secondary=lang==='ar'?site.brand.en:site.brand.ar;

  var style='--dark:'+(clamp(+site.cover.dark,0,80)/100)+';--hv:'+(map[d.heroV]||'flex-end')+';--hh:'+(map[d.heroH]||'flex-start')+';--ha:'+(d.heroH==='center'?'center':d.heroH==='end'?'end':'start');
  return'<section class="'+cls+'" data-sec="hero" id="hero" style="'+style+'">'+

    '<div class="hero-in"><h1>'+words.map(function(w){return'<span class="line"><span>'+esc(w)+'</span></span>'}).join('')+'</h1>'+
    (secondary?'<div class="brand2" aria-hidden="true"><i></i><span lang="'+(lang==='ar'?'en':'ar')+'">'+esc(secondary)+'</span><i></i></div>':'')+
    '<div class="hero-meta">'+((d.tagline||ui.edit)?'<p'+ea('hero.tag','سطر تعريفي عن القرية','',1)+'>'+esc(tx(site.hero.tag))+'</p>':'<span></span>')+
    (d.cue?'<a class="scroll" href="#'+esc(nextSecId())+'">'+STAR+t('scroll')+'</a>':'')+'</div></div></section>';
}
function nextSecId(){
  var f=site.sections.filter(function(s){return s.on&&s.id!=='hero'});
  for(var i=0;i<f.length;i++){if(f[i].id==='featured'&&!featuredList().length)continue;return f[i].id}
  return'top';
}

}

/* ---------- stories ---------- */
function ownerTools(p){
  if(!ui.edit)return'';
  var id=esc(p.id);
  return'<div class="row-tools"><button class="tool" data-act="post-pin" data-id="'+id+'">'+(p.pinned?'إلغاء التثبيت':'📌 تثبيت')+'</button><button class="tool" data-act="post-hide" data-id="'+id+'">'+(p.status==='draft'?'نشر':'إخفاء')+'</button><button class="tool" data-act="post-edit" data-id="'+id+'">تعديل</button><button class="tool danger" data-act="post-del" data-id="'+id+'">حذف</button></div>';
}
function postRow(p,tools){
  var img=safeUrl(p.image);
  return'<article class="post"><button class="post-btn" data-act="post-open" data-id="'+esc(p.id)+'">'+(img?'<img class="post-thumb" alt="" loading="lazy" src="'+img+'">':'')+
    '<span class="post-text"><span class="post-title">'+esc(pTitle(p))+'</span><span class="post-meta">'+postMeta(p)+'</span></span></button>'+tools+'</article>';
}
function personCard(p){
  var img=safeUrl(p.image),ll=lifeLine(p);
  return'<article class="person"><button class="person-btn" data-act="post-open" data-id="'+esc(p.id)+'">'+(img?'<img class="person-img" alt="" loading="lazy" src="'+img+'">':'<span class="person-ph">'+STAR0+'</span>')+
    '<span class="person-name">'+esc(pTitle(p))+'</span><span class="person-dates">'+esc(ll)+(p.place?(ll?' · ':'')+esc(p.place):'')+'</span></button>'+ownerTools(p)+'</article>';
}
function storiesHTML(s){
  var base=shown(),tab=ui.tab;
  if(tab!=='all'&&!catOf(tab))tab=ui.tab='all';
  var tabs='<button data-act="tab" data-tab="all" aria-pressed="'+(tab==='all')+'">'+t('all')+'</button>'+site.cats.filter(function(c){
    return ui.edit||base.some(function(p){return p.cat===c.id});
  }).map(function(c){return'<button data-act="tab" data-tab="'+esc(c.id)+'" aria-pressed="'+(tab===c.id)+'">'+esc(tx(c.name))+'</button>'}).join('');
  var list=sortPosts(base.filter(function(p){return tab==='all'||p.cat===tab}));
  var cat=catOf(tab),body;
  if(cat&&cat.kind==='people'){
    body='<div class="people">'+list.map(personCard).join('')+'</div>';
  }else{
    body='<div class="post-list">'+list.map(function(p){return postRow(p,ownerTools(p))}).join('')+'</div>';
  }
  var pend=pendingPosts(),pendBox='';
  if(pend.length){
    pendBox='<div class="pending-box" id="pending"><h3 class="sub-title">بانتظار مراجعتك ('+nf(pend.length)+')</h3>'+sortPosts(pend).map(function(p){
      var id=esc(p.id);
      return postRow(p,'<div class="row-tools"><button class="tool" data-act="post-open" data-id="'+id+'">قراءة</button><button class="tool" data-act="post-approve" data-id="'+id+'">قبول ونشر</button><button class="tool" data-act="post-edit" data-id="'+id+'">تعديل</button><button class="tool danger" data-act="post-del" data-id="'+id+'">حذف</button></div>');
    }).join('')+'</div>';
  }
  var empty=list.length?'':'<p class="empty">'+(approved().length?t('empty_cat'):t('empty_soon'))+'</p>';
  return secOpen(s)+secTitle(s)+pendBox+'<div class="tabs" role="group">'+tabs+'</div>'+body+empty+
    (ui.edit?'<button class="add-btn" data-act="post-add">＋ إضافة قصة أو مقال أو حدث</button>':(CONFIGURED?'<button class="add-btn" data-act="submit-open">'+t('share_btn')+'</button><p class="note">'+t('share_note')+'</p>':''))+'</section>';
}

/* ---------- map section ---------- */
function mapCfg(){
  var m=site.map||{},lat=+m.lat,lng=+m.lng,z=Math.round(+m.zoom);
  if(!(lat>=-85&&lat<=85))lat=32.82417;
  if(!(lng>=-180&&lng<=180))lng=36.29389;
  if(!(z>=5&&z<=17))z=13;
  return{lat:lat,lng:lng,zoom:z};
}
function mapLinks(){
  var m=mapCfg(),q=m.lat.toFixed(5)+','+m.lng.toFixed(5);
  return{view:'https://www.google.com/maps/search/?api=1&query='+q,dir:'https://www.google.com/maps/dir/?api=1&destination='+q,
    coords:Math.abs(m.lat).toFixed(4)+(m.lat>=0?'°N':'°S')+', '+Math.abs(m.lng).toFixed(4)+(m.lng>=0?'°E':'°W')};
}

    '<aside class="map-card">'+secTitle(s)+'<p class="map-text"'+ea('map.text','وصف موقع القرية','',1)+'>'+esc(tx(m.text))+'</p>'+
    ((chips||ui.edit)?'<div class="chips">'+chips+(ui.edit?'<button class="tool" data-act="chip-add">＋ معلومة</button>':'')+'</div>':'')+

/* ---------- reviews ---------- */
function starRow(n,label){var h='';for(var i=1;i<=5;i++)h+=starIcon(i<=Math.round(n));return'<span class="stars" role="img" aria-label="'+esc(label||n)+'">'+h+'</span>'}
function reviewsHTML(s){
  var ok=reviews.filter(function(r){return r.status==='approved'}),n=ok.length,sum=0,cnt=[0,0,0,0,0,0];
  ok.forEach(function(r){sum+=r.rating;cnt[r.rating]++});

/* ---------- map (small built-in engine: no external library) ---------- */
var LAYERS={
  osm:{max:17,url:function(z,x,y){return'https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png'},
    attr:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'},
  sat:{max:16,url:function(z,x,y){return'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+y+'/'+x},
    attr:'Esri, Maxar, Earthstar Geographics'}
};
var MINZ=6;
function wpx(lng,z){return(lng+180)/360*256*Math.pow(2,z)}
function wpy(lat,z){var s=Math.sin(lat*Math.PI/180);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*Math.pow(2,z)}
function unx(x,z){return x/(256*Math.pow(2,z))*360-180}
function uny(y,z){var n=Math.PI-2*Math.PI*y/(256*Math.pow(2,z));return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)))}
var mm=null,mmIO=null,mmRO=null,mmRaf=0,mmHintT=0,mmFly=0;

function mapDestroy(){
  if(mmIO){mmIO.disconnect();mmIO=null}
  if(mmRO){mmRO.disconnect();mmRO=null}
  if(mmRaf){cancelAnimationFrame(mmRaf);mmRaf=0}
  if(mmFly){cancelAnimationFrame(mmFly);mmFly=0}
  mm=null;
}
function setupMap(){
  mapDestroy();
  var box=$('mapbox');if(!box)return;
  if('IntersectionObserver' in window){
    mmIO=new IntersectionObserver(function(es){if(es[0].isIntersecting){mmIO.disconnect();mmIO=null;mapInit(box)}},{rootMargin:'400px'});
    mmIO.observe(box);
  }else mapInit(box);
}
function mmHint(msg){
  if(!mm)return;
  var h=mm.hint;h.textContent=msg;h.classList.add('show');
  clearTimeout(mmHintT);mmHintT=setTimeout(function(){h.classList.remove('show')},2200);
}
function mapInit(box){
  var c=mapCfg(),layer=site.map.layer==='sat'?'sat':'osm';
  mm={box:box,z:Math.min(c.zoom,LAYERS[layer].max),lat:c.lat,lng:c.lng,pin:{lat:c.lat,lng:c.lng},layer:layer,tiles:{},poi:{},ok:0,err:0,moved:false};
  var brand=lang==='ar'?site.brand.ar:site.brand.en;
  box.innerHTML='<div class="mm-tiles"></div><div class="mm-vig"></div>'+
    '<div class="mm-pin"><span class="pin-ring"></span><span class="pin-dot">'+STAR0+'</span><span class="pin-label">'+esc(brand)+'</span></div>'+
    '<div class="mm-ctl"><button type="button" data-mm="in" aria-label="'+t('zoom_in')+'">+</button><button type="button" data-mm="out" aria-label="'+t('zoom_out')+'">−</button><button type="button" data-mm="home" aria-label="'+t('recenter')+'">◎</button></div>'+
    '<div class="mm-hint" role="status"></div><div class="mm-attr"></div>';
  mm.layerEl=box.querySelector('.mm-tiles');mm.pinEl=box.querySelector('.mm-pin');mm.hint=box.querySelector('.mm-hint');mm.attrEl=box.querySelector('.mm-attr');
  mm.attrEl.innerHTML=LAYERS[layer].attr;
  (site.map.pois||[]).forEach(function(p){
    if(!(p.lat>=-85&&p.lat<=85&&p.lng>=-180&&p.lng<=180))return;
    var el=document.createElement('div');el.className='mm-poi';el.dataset.id=p.id;
    el.innerHTML='<button type="button" class="poi-b" aria-label="'+esc(tx(p.name))+'">'+esc(p.icon||'📍')+'</button><span class="poi-l">'+esc(tx(p.name))+'</span>';
    box.appendChild(el);mm.poi[p.id]={el:el,lat:p.lat,lng:p.lng};
  });
  bindMap(box);
  if('ResizeObserver' in window){mmRO=new ResizeObserver(mmQueue);mmRO.observe(box)}
  mmRender();
  setTimeout(function(){
    if(mm&&mm.box===box&&mm.ok===0&&mm.err>0&&!$('mapnote')){
      var n=document.createElement('div');n.id='mapnote';n.className='map-note';n.textContent=t('map_fail');
      $('mapwrap').appendChild(n);
    }
  },7000);
}
function mmQueue(){if(!mmRaf){mmRaf=requestAnimationFrame(function(){mmRaf=0;mmRender()})}}
function mmRender(){
  if(!mm)return;
  var b=mm.box,w=b.clientWidth,h=b.clientHeight;if(!w||!h)return;
  var z=mm.z,n=Math.pow(2,z),cx=wpx(mm.lng,z),cy=wpy(mm.lat,z),ox=cx-w/2,oy=cy-h/2;
  var x0=Math.floor(ox/256)-1,x1=Math.floor((ox+w)/256)+1,y0=Math.floor(oy/256)-1,y1=Math.floor((oy+h)/256)+1;
  var need={},L=LAYERS[mm.layer];
  for(var ty=y0;ty<=y1;ty++){
    if(ty<0||ty>=n)continue;
    for(var tx0=x0;tx0<=x1;tx0++){
      var wx=((tx0%n)+n)%n,key=mm.layer+'/'+z+'/'+tx0+'/'+ty;
      need[key]=1;
      var img=mm.tiles[key];
      if(!img){
        img=new Image();img.className='mm-tile';img.alt='';img.draggable=false;
        img.onload=function(){this.classList.add('in');if(mm)mm.ok++};
        img.onerror=function(){if(mm)mm.err++};
        img.src=L.url(z,wx,ty);
        mm.tiles[key]=img;mm.layerEl.appendChild(img);
      }
      img.style.transform='translate('+Math.round(tx0*256-ox)+'px,'+Math.round(ty*256-oy)+'px)';
    }
  }
  Object.keys(mm.tiles).forEach(function(k){if(!need[k]){mm.tiles[k].remove();delete mm.tiles[k]}});
  mm.pinEl.style.transform='translate('+Math.round(wpx(mm.pin.lng,z)-ox)+'px,'+Math.round(wpy(mm.pin.lat,z)-oy)+'px)';
  Object.keys(mm.poi).forEach(function(id){
    var p=mm.poi[id];p.el.style.transform='translate('+Math.round(wpx(p.lng,z)-ox)+'px,'+Math.round(wpy(p.lat,z)-oy)+'px)';
  });
  b.classList.toggle('mm-z',z>=14);
}
function mmPanBy(dx,dy){
  var z=mm.z;
  mm.lng=unx(wpx(mm.lng,z)-dx,z);
  mm.lat=Math.max(-84,Math.min(84,uny(wpy(mm.lat,z)-dy,z)));
  mmQueue();
}
function mmZoomTo(nz,ax,ay){
  nz=Math.max(MINZ,Math.min(LAYERS[mm.layer].max,Math.round(nz)));
  if(nz===mm.z)return;
  var b=mm.box,w=b.clientWidth,h=b.clientHeight,z=mm.z;
  if(ax==null){ax=w/2;ay=h/2}
  var alng=unx(wpx(mm.lng,z)+(ax-w/2),z),alat=uny(wpy(mm.lat,z)+(ay-h/2),z);
  mm.z=nz;
  mm.lng=unx(wpx(alng,nz)-(ax-w/2),nz);
  mm.lat=Math.max(-84,Math.min(84,uny(wpy(alat,nz)-(ay-h/2),nz)));
  mmQueue();
}
function mmFlyTo(lat,lng,z){
  if(!mm)return;
  if(z&&z!==mm.z){mm.z=Math.max(MINZ,Math.min(LAYERS[mm.layer].max,z))}
  if(reduce){mm.lat=lat;mm.lng=lng;mmRender();return}
  var z0=mm.z,x0=wpx(mm.lng,z0),y0=wpy(mm.lat,z0),x1=wpx(lng,z0),y1=wpy(lat,z0),t0=performance.now(),dur=650;
  if(mmFly)cancelAnimationFrame(mmFly);
  (function step(now){
    var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    if(!mm)return;
    mm.lng=unx(x0+(x1-x0)*e,z0);mm.lat=uny(y0+(y1-y0)*e,z0);mmRender();
    if(k<1)mmFly=requestAnimationFrame(step);else mmFly=0;
  })(t0);
}
function mmSetLayer(name){
  if(!mm||!LAYERS[name]||mm.layer===name)return;
  mm.layer=name;
  if(mm.z>LAYERS[name].max)mm.z=LAYERS[name].max;
  $('mapwrap').classList.toggle('map-sat',name==='sat');
  mm.attrEl.innerHTML=LAYERS[name].attr;
  [].forEach.call(document.querySelectorAll('[data-act="map-layer"]'),function(b){b.setAttribute('aria-pressed',b.dataset.layer===name?'true':'false')});
  mmRender();
}
function mmLatLngAt(px,py){
  var w=mm.box.clientWidth,h=mm.box.clientHeight,z=mm.z;
  return{lng:unx(wpx(mm.lng,z)+(px-w/2),z),lat:uny(wpy(mm.lat,z)+(py-h/2),z)};
}
function mmPlace(px,py){
  var p=mmLatLngAt(px,py);
  site.map.lat=+p.lat.toFixed(5);site.map.lng=+p.lng.toFixed(5);site.map.zoom=mm.z;
  mm.pin={lat:site.map.lat,lng:site.map.lng};
  var L=mapLinks();
  $('mapview').href=L.view;$('mapdir').href=L.dir;$('mapcoords').textContent=L.coords;
  queueSettings();mmQueue();
}
function bindMap(box){
  var drag=null,t2=null,lastWheel=0,lastTouchHint=0;
  function dist(tt){var a=tt[0],b=tt[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
  function mid(tt){var r=box.getBoundingClientRect();return{x:(tt[0].clientX+tt[1].clientX)/2-r.left,y:(tt[0].clientY+tt[1].clientY)/2-r.top}}
  box.addEventListener('pointerdown',function(e){
    if(e.pointerType==='touch'||e.button!==0||e.target.closest('.mm-ctl'))return;
    drag={x:e.clientX,y:e.clientY,total:0};mm.moved=false;
    try{box.setPointerCapture(e.pointerId)}catch(x){}
    box.classList.add('drag');
  });
  box.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    drag.x=e.clientX;drag.y=e.clientY;drag.total+=Math.abs(dx)+Math.abs(dy);
    if(drag.total>4)mm.moved=true;
    mmPanBy(dx,dy);
  });
  function endDrag(){drag=null;box.classList.remove('drag')}
  box.addEventListener('pointerup',endDrag);
  box.addEventListener('pointercancel',endDrag);
  box.addEventListener('click',function(e){
    if(e.target.closest('.mm-ctl'))return;
    var pb=e.target.closest('.poi-b');
    if(pb){var pe=pb.parentNode;var on=pe.classList.contains('on');[].forEach.call(box.querySelectorAll('.mm-poi.on'),function(x){x.classList.remove('on')});if(!on)pe.classList.add('on');return}
    if(mm.moved){mm.moved=false;return}
    if(!ui.edit)return;
    var r=box.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
    if(ui.poiMode){var p=mmLatLngAt(px,py);ui.poiMode=false;openPoiDialog(+p.lat.toFixed(5),+p.lng.toFixed(5));renderSec('map')}
    else mmPlace(px,py);
  });
  box.addEventListener('dblclick',function(e){
    if(e.target.closest('.mm-ctl'))return;
    var r=box.getBoundingClientRect();mmZoomTo(mm.z+1,e.clientX-r.left,e.clientY-r.top);
  });
  box.addEventListener('wheel',function(e){
    if(e.ctrlKey||e.metaKey){
      e.preventDefault();
      var now=Date.now();if(now-lastWheel<180)return;lastWheel=now;
      var r=box.getBoundingClientRect();mmZoomTo(mm.z+(e.deltaY<0?1:-1),e.clientX-r.left,e.clientY-r.top);
    }else mmHint(t('map_hint_ctrl'));
  },{passive:false});
  box.addEventListener('touchstart',function(e){
    if(e.touches.length===2){var m=mid(e.touches);t2={d:dist(e.touches),x:m.x,y:m.y}}
  },{passive:true});
  box.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&t2){
      e.preventDefault();
      var m=mid(e.touches),d=dist(e.touches);
      mm.moved=true;
      mmPanBy(m.x-t2.x,m.y-t2.y);
      var ratio=d/t2.d;
      if(ratio>=1.6){mmZoomTo(mm.z+1,m.x,m.y);t2.d=d}
      else if(ratio<=0.62){mmZoomTo(mm.z-1,m.x,m.y);t2.d=d}
      t2.x=m.x;t2.y=m.y;
    }else if(e.touches.length===1){
      var now=Date.now();if(now-lastTouchHint>4000){lastTouchHint=now;mmHint(t('map_hint_touch'))}
    }
  },{passive:false});
  function tEnd(e){if(e.touches.length<2)t2=null}
  box.addEventListener('touchend',tEnd);
  box.addEventListener('touchcancel',tEnd);
  box.addEventListener('keydown',function(e){
    var k=e.key,step=80;
    if(k==='ArrowLeft'){mmPanBy(step,0)}else if(k==='ArrowRight'){mmPanBy(-step,0)}
    else if(k==='ArrowUp'){mmPanBy(0,step)}else if(k==='ArrowDown'){mmPanBy(0,-step)}
    else if(k==='+'||k==='='){mmZoomTo(mm.z+1)}else if(k==='-'){mmZoomTo(mm.z-1)}
    else return;
    e.preventDefault();
  });
  box.querySelector('.mm-ctl').addEventListener('click',function(e){
    var b=e.target.closest('[data-mm]');if(!b)return;
    var a=b.dataset.mm;
    if(a==='in')mmZoomTo(mm.z+1);
    else if(a==='out')mmZoomTo(mm.z-1);
    else{var c=mapCfg();mmFlyTo(c.lat,c.lng,Math.min(c.zoom,LAYERS[mm.layer].max))}
  });
}

function fromRow(r){

/* ---------- saving (debounced, with status) ---------- */
var q={timers:0,inflight:0,error:false},timers={};
function statusText(){return q.inflight?'جاري الحفظ...':q.timers?'تغييرات قيد الحفظ...':q.error?'تعذّر الحفظ، تأكد من الاتصال':'تم الحفظ'}
function updateBar(){
  var s=$('status');if(!s)return;
  s.textContent=statusText();
  $('bar').classList.toggle('warn',!!(q.inflight||q.timers||q.error));
  var n=pendingPosts().length+pendingReviews().length;
  $('revbtn').textContent=n?'مراجعة ('+nf(n)+')':'مراجعة';
}
async function run(fn){
  q.inflight++;updateBar();
  var ok=false;
  try{ok=await fn()}catch(e){ok=false}
  q.inflight--;q.error=!ok;
  if(!ok)toast('تعذّر الحفظ. تأكد من الاتصال ثم جرّب مرة ثانية.');
  updateBar();
  return ok;
}
function debounce(key,fn,ms){
  if(timers[key]){clearTimeout(timers[key].t)}else{q.timers++}
  timers[key]={fn:fn,t:setTimeout(function(){delete timers[key];q.timers--;run(fn)},ms)};
  updateBar();
}
function flush(){
  Object.keys(timers).forEach(function(k){var x=timers[k];clearTimeout(x.t);delete timers[k];q.timers--;run(x.fn)});
}
async function saveSettings(){
  var r=await sb.from('site_settings').update({data:site,updated_at:new Date().toISOString()}).eq('id',1).select('id');
  return !r.error&&!!r.data&&r.data.length>0;
}
function queueSettings(){debounce('settings',saveSettings,1200)}
function queuePhoto(id){

/* ---------- images, videos, uploads ---------- */
function readImage(file,maxSide,quality,png){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('decode'))};
      im.onload=function(){
        var s=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
        var w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');
        if(!png){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
        x.drawImage(im,0,0,w,h);
        c.toBlob(function(b){b?res(b):rej(new Error('blob'))},png?'image/png':'image/jpeg',quality);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function upload(blob,folder,ext,ctype){
  var path=folder+'/'+uid()+'.'+(ext||'jpg');
  var r=await sb.storage.from('media').upload(path,blob,{contentType:ctype||'image/jpeg',upsert:false});
  if(r.error)return null;
  var u=sb.storage.from('media').getPublicUrl(path);
  return{path:path,url:u.data.publicUrl};
}
function removeFiles(urls){
  var paths=urls.map(pathFromUrl).filter(Boolean);
  if(paths.length&&sb)sb.storage.from('media').remove(paths).then(function(){},function(){});
}
function videoPoster(file){
  return new Promise(function(res){
    var v=document.createElement('video'),url=URL.createObjectURL(file),done=false;
    function fin(b){if(done)return;done=true;try{URL.revokeObjectURL(url)}catch(e){}res(b||null)}
    v.muted=true;v.playsInline=true;v.preload='metadata';
    v.onloadeddata=function(){try{v.currentTime=Math.min(1,(v.duration||2)/3)}catch(e){fin(null)}};
    v.onseeked=function(){
      try{
        var w=v.videoWidth,h=v.videoHeight;if(!w)return fin(null);
        var s=Math.min(1,900/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(function(b){fin(b)},'image/jpeg',.78);
      }catch(e){fin(null)}
    };
    v.onerror=function(){fin(null)};
    setTimeout(function(){fin(null)},9000);
    v.src=url;
  });
}
function nextSort(){var m=0;photos.forEach(function(p){if(p.sort>m)m=p.sort});return m+1}
async function addVideo(file){
  var ext=(/\.([a-z0-9]{2,4})$/i.exec(file.name||'')||[])[1]||'';ext=ext.toLowerCase();
  var okExt={mp4:'video/mp4',m4v:'video/mp4',webm:'video/webm',mov:'video/quicktime'};
  var ctype=okExt[ext]||(/^video\/(mp4|webm|quicktime)$/.test(file.type)?file.type:'');
  if(!ctype){toast('نوع الفيديو غير مدعوم. استعمل MP4 أو WebM أو MOV.');return}
  if(!ext)ext=ctype==='video/webm'?'webm':ctype==='video/quicktime'?'mov':'mp4';
  if(file.size>50*1024*1024){toast('حجم الفيديو أكبر من 50 ميغابايت. اضغطه أو ارفعه على يوتيوب وأضف الرابط.');return}
  toast('جاري رفع الفيديو... لا تغلق الصفحة');
  var pb=await videoPoster(file),poster=null;
  var up=await upload(file,'videos',ext,ctype);
  if(!up){toast('تعذّر رفع الفيديو. تأكد من الاتصال وحجمه.');return}
  if(pb){var pu=await upload(pb,'videos','jpg','image/jpeg');if(pu)poster=pu.url}
  var r=await sb.from('photos').insert({url:up.url,kind:'video',poster_url:poster,caption:'',caption_en:'',sort:nextSort()}).select().single();
  if(r.error||!r.data){removeFiles([up.url].concat(poster?[poster]:[]));toast('تعذّر حفظ الفيديو في القائمة.');return}
  photos.push(photoFromRow(r.data));renderSec('photos');toast('تمت إضافة الفيديو.');
}
async function addYouTube(link){
  var id=ytId(link);
  if(!id){toast('الرابط غير صحيح. الصق رابط فيديو يوتيوب.');return false}
  var r=await sb.from('photos').insert({url:'https://www.youtube.com/watch?v='+id,kind:'youtube',yt_id:id,caption:'',caption_en:'',sort:nextSort()}).select().single();
  if(r.error||!r.data){toast('تعذّرت إضافة الفيديو.');return false}
  photos.push(photoFromRow(r.data));renderSec('photos');toast('تمت إضافة الفيديو.');return true;
}
function pickFiles(kind,accept,multi){
  ui.fileFor=kind;var f=$('file');f.accept=accept||'image/*';f.multiple=!!multi;f.value='';f.click();
}
async function onFiles(files){
  var kind=ui.fileFor;if(!files.length||!kind)return;
  if(kind==='video'){await addVideo(files[0]);return}
  var max=kind==='cover'?1800:kind==='photos'?1600:kind==='emblem'?600:1200;
  if(kind==='post'||kind==='submit'){
    try{var b=await readImage(files[0],max,.8);if(edPost){edPost._blob=b;edPost.image='';refreshEditorImg()}}catch(e){toast(t('img_fail'))}
    return;
  }
  var added=0,failed=0;
  for(var i=0;i<files.length;i++){
    toast('جاري رفع الصور ('+(i+1)+' من '+files.length+')...');
    var blob;try{blob=await readImage(files[i],max,.8,kind==='emblem')}catch(e){failed++;continue}
    var up=await upload(blob,kind==='cover'?'covers':kind==='emblem'?'site':kind==='blk'?'blocks':'photos',kind==='emblem'?'png':'jpg',kind==='emblem'?'image/png':'image/jpeg');
    if(!up){failed++;continue}
    if(kind==='photos'){
      var r=await sb.from('photos').insert({url:up.url,kind:'image',caption:'',caption_en:'',sort:nextSort()}).select().single();
      if(r.error||!r.data){failed++;removeFiles([up.url]);continue}
      photos.push(photoFromRow(r.data));
    }else if(kind==='cover'){site.cover.imgs.push(up.url);queueSettings()}
    else if(kind==='emblem'){if(site.emblem)removeFiles([site.emblem]);site.emblem=up.url;queueSettings()}
    else if(kind==='blk'){var bl=site.blocks[ui.fileIdx];if(bl){if(bl.image)removeFiles([bl.image]);bl.image=up.url;queueSettings()}}
    added++;
  }
  if(added){
    if(kind==='photos')renderSec('photos');
    else if(kind==='cover'){renderSec('hero');refreshDesign()}
    else if(kind==='emblem'){renderAll();refreshDesign()}
    else if(kind==='blk'){var bs=site.sections.filter(function(x){return x.id==='blk_'+(site.blocks[ui.fileIdx]||{}).id})[0];if(bs)renderSec(bs.id)}
  }
  toast(failed?'تعذّر رفع '+failed+' من الصور. تأكد من الاتصال وحجم الصورة.':added?'تمت الإضافة.':'ما تمت إضافة شيء.');
}

/* ---------- loading ---------- */
function loadLib(){
  return new Promise(function(res){
    if(window.supabase)return res(true);
    var urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2'];
    (function next(i){
      if(i>=urls.length)return res(false);
      var sc=document.createElement('script'),done=false,tm;
      function fin(ok){
        if(done)return;done=true;clearTimeout(tm);
        if(ok)res(true);else{sc.remove();next(i+1)}
      }
      tm=setTimeout(function(){fin(false)},3500);
      sc.onload=function(){fin(!!window.supabase)};
      sc.onerror=function(){fin(false)};
      sc.src=urls[i];
      document.head.appendChild(sc);
    })(0);
  });
}
function withTimeout(p,ms,fallback){
  return Promise.race([p,new Promise(function(r){setTimeout(function(){r(fallback)},ms)})]);
}
async function loadData(){
  var s=await sb.from('site_settings').select('data').eq('id',1).maybeSingle();
  if(!s.error&&s.data&&s.data.data&&typeof s.data.data==='object')site=normalize(merge(defaults(),s.data.data));
  var p=await sb.from('posts').select('*').order('created_at',{ascending:false});
  if(!p.error&&p.data)posts=p.data.map(fromRow);
  var h=await sb.from('photos').select('*').order('sort',{ascending:true}).order('created_at',{ascending:true});
  if(h.error)h=await sb.from('photos').select('*').order('created_at',{ascending:true});
  if(!h.error&&h.data)photos=h.data.map(photoFromRow);
  var r=await sb.from('reviews').select('*').order('created_at',{ascending:false});
  if(!r.error&&r.data)reviews=r.data.map(reviewFromRow);
  return !s.error&&!p.error&&!h.error;
}
async function initBackend(){
  if(!CONFIGURED)return;
  var ok=await loadLib();
  if(!ok)return;
  try{
    sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
    var dp=loadData(),finished=false;
    await withTimeout(dp.then(function(r){finished=true;return r},function(){finished=true;return false}),7000,false);
    ls('malha-noloader',site.design.loader===false?'1':null);
    lang=pickLang();renderAll();
    if(site.design.loader===false&&liftLoader)liftLoader();
    if(!finished)dp.then(function(){ls('malha-noloader',site.design.loader===false?'1':null);lang=pickLang();renderAll()},function(){});
    var sess=await withTimeout(sb.auth.getSession(),5000,null);
    if(sess&&sess.data&&sess.data.session){
      var isAdmin=await withTimeout(checkAdmin(),8000,false);
      if(isAdmin)renderAll();
    }
  }catch(e){}
}

async function savePost(approveToo){
  var d=$('editor'),tAr=$('p-title').value.trim(),tEn=$('p-title-en').value.trim();
  if(!tAr&&!tEn){toast('اكتب العنوان أولاً');$('p-title').focus();return}
  edPost.cat=$('p-cat').value;
  edPost.title={ar:tAr,en:tEn};edPost.body={ar:$('p-body').value,en:$('p-body-en').value};
  edPost.author=$('p-author').value.trim();
  var kind=kindOf(edPost.cat);
  edPost.date=$('p-date').value;
  edPost.time=kind==='event'?$('p-time').value:'';
  edPost.place=(kind==='event'||kind==='people')?$('p-place').value.trim():'';
  edPost.extra=edPost.extra||{};
  if(kind==='people')edPost.extra.born=$('p-born').value.trim();else delete edPost.extra.born;
  edPost.pinned=$('p-pin').checked;
  edPost.status=$('p-status').value;
  if(approveToo)edPost.status='approved';
  var old=posts.filter(function(x){return x.id===edPost.id})[0],oldImage=old?old.image:'';
  toast('جاري الحفظ...');
  if(edPost._blob){
    var up=await upload(edPost._blob,'posts');
    if(!up){toast('تعذّر رفع الصورة. جرّب مرة ثانية.');return}
    edPost.image=up.url;
  }
  var row=toRow(edPost),res;
  if(edPost._new)res=await sb.from('posts').insert(row).select().single();
  else res=await sb.from('posts').update(row).eq('id',edPost.id).select().single();
  if(res.error||!res.data){toast('تعذّر الحفظ. تأكد من الاتصال، وأن تحديث قاعدة البيانات (update.sql) تم تشغيله.');return}
  var saved=fromRow(res.data);
  if(edPost._new)posts.push(saved);else posts=posts.map(function(x){return x.id===saved.id?saved:x});
  if(oldImage&&oldImage!==saved.image)removeFiles([oldImage]);
  edPost=null;$('editor').close();renderAll();
  toast(saved.status==='approved'?'تم النشر.':'تم الحفظ.');
}
async function patchPost(id,patch,okMsg){
  var r=await sb.from('posts').update(patch).eq('id',id).select().single();
  if(r.error||!r.data){toast('تعذّر تنفيذ العملية. جرّب مرة ثانية.');return false}
  posts=posts.map(function(x){return x.id===id?fromRow(r.data):x});
  renderAll();if(okMsg)toast(okMsg);return true;
}
function approvePost(id){return patchPost(id,{status:'approved'},'تم قبول المشاركة ونشرها.')}
async function deletePost(id){
  var p=posts.filter(function(x){return x.id===id})[0];
  var r=await sb.from('posts').delete().eq('id',id).select('id');
  if(r.error||!r.data||!r.data.length){toast('تعذّر الحذف. جرّب مرة ثانية.');return}
  posts=posts.filter(function(x){return x.id!==id});
  if(p&&p.image)removeFiles([p.image]);
  renderAll();toast('تم الحذف.');
}

async function movePhoto(i,dir){

function loginHTML(){

    '<label class="fld">كلمة السر<input id="l-pass" type="password" autocomplete="current-password" dir="ltr" autocapitalize="off" autocorrect="off" spellcheck="false"></label>'+
    '<label class="opt" style="margin-top:-6px"><input type="checkbox" data-act="pass-show">إظهار كلمة السر</label>'+

    '<div class="ed-actions"><button class="primary" data-act="login-go" id="l-go">دخول</button><button data-close>إلغاء</button></div></div>';

async function doLogin(){
  var email=$('l-email').value.trim(),pass=$('l-pass').value;
  var err=$('l-err');err.hidden=true;
  if(!email||!pass){err.textContent='اكتب البريد وكلمة السر.';err.hidden=false;return}
  var b=$('l-go');b.disabled=true;b.textContent='جاري الدخول...';
  var r=await sb.auth.signInWithPassword({email:email,password:pass});
  if(r.error){
    b.disabled=false;b.textContent='دخول';
    var em=String(r.error.message||''),why;
    if(/invalid login credentials/i.test(em))why='البريد أو كلمة السر غير صحيحة.';
    else if(/email not confirmed/i.test(em))why='الحساب غير مؤكد في Supabase. افتح الحساب هناك وفعّل التأكيد.';
    else if(/api key|apikey|jwt/i.test(em))why='مفتاح المشروع داخل الملف غير صحيح.';
    else if(/disabled|not allowed|provider/i.test(em))why='تسجيل الدخول بالبريد مغلق في إعدادات Supabase.';
    else if(/fetch|network|timeout|load failed/i.test(em)||!r.error.status)why='تعذّر الاتصال بـ Supabase. تأكد من الإنترنت ثم جرّب.';
    else why='تعذّر تسجيل الدخول.';
    err.textContent=why+' ['+em.slice(0,90)+']';err.hidden=false;return;
  }
  var ok=await checkAdmin();
  b.disabled=false;b.textContent='دخول';
  if(!ok){await sb.auth.signOut();err.textContent='هذا الحساب ليس مالك الموقع.';err.hidden=false;return}
  $('login').close();
  enterEdit();
}
async function checkAdmin(){
  var r=await sb.rpc('is_admin');
  if(r.error||r.data!==true)return false;
  ui.admin=true;
  var pr=await sb.from('posts').select('*').order('created_at',{ascending:false});
  if(!pr.error&&pr.data)posts=pr.data.map(fromRow);
  var rr=await sb.from('reviews').select('*').order('created_at',{ascending:false});
  if(!rr.error&&rr.data)reviews=rr.data.map(reviewFromRow);
  $('fab').hidden=ui.edit;
  return true;
}
function enterEdit(){
  if(ui.edit)return;
  ui.edit=true;root.classList.add('editing');$('fab').hidden=true;
  renderAll();
}
function exitEdit(){
  flush();
  ui.edit=false;ui.poiMode=false;root.classList.remove('editing');$('fab').hidden=!ui.admin;
  renderAll();
}
async function logout(){
  flush();
  await sb.auth.signOut();
  ui.admin=false;ui.edit=false;root.classList.remove('editing');$('fab').hidden=true;
  $('design').close();
  await loadData();renderAll();toast('تم تسجيل الخروج.');
}

function serr(m){var e=$('s-err');if(e){e.textContent=m;e.hidden=!m}}
async function sendSubmission(){
  var last=+ls('malha-last-submit')||0;
  if(Date.now()-last<60000){serr(t('cooldown'));return}
  var cat=$('s-cat').value,kind=kindOf(cat);
  var title=$('s-title').value.trim(),body=$('s-body').value.trim();
  if(!title){serr(kind==='people'?t('err_name'):t('err_title'));return}
  if(kind==='list'&&body.length<20){serr(t('err_body'));return}
  if($('s-web').value){$('submit').close();toast(t('sent_ok'));return}
  serr('');
  var btn=$('s-send');btn.disabled=true;btn.textContent=t('sending');
  var imageUrl=null;
  if(edPost&&edPost._blob){
    var up=await upload(edPost._blob,'submissions');
    if(!up){serr(t('img_up_fail'));btn.disabled=false;btn.textContent=t('send');return}
    imageUrl=up.url;
  }
  var extra={};if(kind==='people'){var bv=$('s-born').value.trim();if(bv)extra.born=bv}
  var row={type:cat,title:title,body:body,post_date:$('s-date').value||todayISO(),post_time:kind==='event'?($('s-time').value||null):null,
    place:(kind==='event'||kind==='people')?$('s-place').value.trim():'',image_url:imageUrl,author_name:$('s-author').value.trim(),status:'pending',extra:extra};
  var res=await sb.from('posts').insert(row);
  btn.disabled=false;btn.textContent=t('send');
  if(res.error){serr(t('send_fail'));return}
  ls('malha-last-submit',String(Date.now()));
  edPost=null;$('submit').close();
  toast(t('sent_ok'));
}

var revRating=0;

  revRating=n;

function rerr(m){var e=$('rv-err');if(e){e.textContent=m;e.hidden=!m}}
async function sendReview(){
  var last=+ls('malha-last-review')||0;
  if(Date.now()-last<60000){rerr(t('rev_cool'));return}
  var name=$('rv-name').value.trim(),comment=$('rv-text').value.trim();
  if(!revRating){rerr(t('rev_err_rating'));return}
  if(!name){rerr(t('rev_err_name'));return}
  if($('rv-web').value){toast(t('rev_thanks'));return}
  rerr('');
  var btn=$('rv-send');btn.disabled=true;btn.textContent=t('rev_sending');
  var auto=!!site.reviews.auto,row={name:name,rating:revRating,comment:comment,status:auto?'approved':'pending'},res;
  if(auto){
    res=await sb.from('reviews').insert(row).select().single();
    if(res.error){row.status='pending';auto=false;res=await sb.from('reviews').insert(row)}
  }else res=await sb.from('reviews').insert(row);
  btn.disabled=false;btn.textContent=t('rev_send');
  if(res.error){rerr(t('rev_err_fail'));return}
  ls('malha-last-review',String(Date.now()));
  if(auto&&res.data){reviews.push(reviewFromRow(res.data));renderSec('reviews');toast(t('rev_thanks_auto'))}
  else{toast(t('rev_thanks'));$('rv-name').value='';$('rv-text').value='';setRevStars(0)}
}

    if(l){var cur=getPath(site,path);if(!cur||typeof cur!=='object')setPath(site,path,{ar:cur==null?'':String(cur),en:''});getPath(site,path)[l]=val}
    else setPath(site,path,val);
    queueSettings();
    /* re-render after this event finishes: replacing the focused field inside its own change/blur event throws */
    setTimeout(function(){renderAll()},0);
  }
});
document.addEventListener('keydown',function(e){
  var tg=e.target;
  if(ui.edit&&e.key==='Enter'&&tg.hasAttribute&&tg.hasAttribute('data-line')){e.preventDefault();tg.blur();return}
  if(e.key==='Enter'&&(tg.id==='l-email'||tg.id==='l-pass')){e.preventDefault();doLogin();return}
  if(e.key==='Escape'&&ui.menu){ui.menu=false;root.classList.remove('menuopen')}
  if($('viewer')&&$('viewer').open){var nx=lang==='ar'?'ArrowLeft':'ArrowRight',pv=lang==='ar'?'ArrowRight':'ArrowLeft';if(e.key===nx)showPhoto(ui.vi+1);else if(e.key===pv)showPhoto(ui.vi-1)}
});
document.addEventListener('paste',function(e){
  var tg=e.target;
  if(ui.edit&&tg.closest&&tg.closest('[data-path]')){
    e.preventDefault();
    var tx0=((e.clipboardData||window.clipboardData).getData('text/plain')||'');
    if(tg.closest('[data-line]'))tx0=tx0.replace(/\s+/g,' ');
    document.execCommand('insertText',false,tx0);
  }
});

/* a broken picture should never leave a hole or hide the tools around it */
document.addEventListener('error',function(e){
  var im=e.target;
  if(!im||im.tagName!=='IMG'||!im.closest)return;
  var ph=im.closest('.ph-btn');
  if(ph){var sp=document.createElement('span');sp.className='ph-vph';im.replaceWith(sp);return}
  if(im.classList.contains('fc-img')||im.classList.contains('person-img')){
    var s2=document.createElement('span');s2.className=im.classList.contains('fc-img')?'fc-ph':'person-ph';s2.innerHTML=STAR0;im.replaceWith(s2);return;
  }
  if(im.classList.contains('post-thumb'))im.remove();
},true);

/* ---------- boot ---------- */
buildChrome();
lang=pickLang();
renderAll();
var dataReady=initBackend();

function reveal(){root.classList.remove('loading');root.classList.add('ready')}
if(reduce||ls('malha-noloader')==='1'){
  reveal();
}else{
  var loader=document.createElement('div');
  loader.className='loader';loader.setAttribute('aria-hidden','true');
  loader.innerHTML='<div class="loader-row"><span>'+esc(tx(site.loader.a))+'</span>'+STAR+'<span>'+esc(tx(site.loader.b))+'</span></div><div class="count" id="count">'+dig('0')+'%</div>';
  document.body.appendChild(loader);
  var lifted=false;
  var lift=function(){
    if(lifted)return;lifted=true;
    loader.classList.add('done');reveal();setTimeout(function(){loader.remove()},1300);
  };
  liftLoader=lift;
  var finish=function(){
    Promise.race([dataReady.then(function(){},function(){}),new Promise(function(r){setTimeout(r,1500)})]).then(lift,lift);
  };
  setTimeout(lift,8000);
  var run2=function(){
    var start=null,dur=2000,count=$('count');
    var tick=function(ts){
      if(start===null)start=ts;
      var p=Math.min((ts-start)/dur,1),eased=1-Math.pow(1-p,2.2);
      count.textContent=dig(Math.round(eased*100))+(lang==='ar'?'٪':'%');
      if(p<1)requestAnimationFrame(tick);else setTimeout(finish,250);
    };
    requestAnimationFrame(tick);
  };
  if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,1200)})]).then(run2);
  else run2();
}

})();
</script>
</body>
</html>
