<!doctype html>
<html lang="ar" dir="rtl" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="مليحة العطش: قرية في محافظة درعا، جنوب سوريا. صور وحكايات ومعلومات عنها.">
<title>مليحة العطش — درعا، سوريا</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌾%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#d9a62e; --fg1:#1c1d1a;
  --bg2:#1c1d1a; --fg2:#f5f3ee;
  --bg3:#ecebe6; --fg3:#1c1d1a;
  --display:"Lalezar","Cairo","Tajawal",Impact,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --pad:clamp(20px,4vw,64px);
  --ease:cubic-bezier(.2,.7,.2,1);
  --ui:#161614; --ui-fg:#f5f3ee;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px;-webkit-text-size-adjust:100%}
html.loading,html.loading body,html.modal,html.modal body{overflow:hidden}
body{
  margin:0;background:var(--bg1);color:var(--fg1);
  font-family:var(--body);font-size:clamp(1rem,.9rem + .5vw,1.2rem);line-height:1.7;
  overflow-x:hidden;
}
a{color:inherit}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid currentColor;outline-offset:4px}
[data-path]{white-space:pre-line}

.spin{animation:spin 3.2s cubic-bezier(.6,0,.4,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* loader */
.loader{
  position:fixed;inset:0;z-index:100;background:var(--bg2);color:var(--fg2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(20px,4vw,48px);
  transition:transform 1s cubic-bezier(.76,0,.24,1);
}
.loader.done{transform:translateY(-100%)}
.loader-row{display:flex;align-items:center;gap:clamp(10px,3vw,40px);font-family:var(--display);font-size:min(20vw,13rem);line-height:1.1}
.loader-row svg{width:.8em;height:.8em;flex:none;color:var(--bg1)}
.count{font-size:.95rem;opacity:.7}

/* nav */
.nav{
  position:fixed;top:0;inset-inline:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px var(--pad);
  background:var(--bg1);color:var(--fg1);
  box-shadow:0 1px 0 color-mix(in srgb,var(--fg1) 18%,transparent);
}
.nav a{text-decoration:none}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:clamp(1.25rem,4vw,1.7rem);line-height:1;white-space:nowrap}
.logo svg{width:.8em;height:.8em;flex:none}
.nav ul{display:flex;gap:clamp(10px,3vw,40px);list-style:none;margin:0;padding:0;font-weight:500;font-size:clamp(.85rem,2.6vw,1.05rem);white-space:nowrap}
.cfgwarn{position:fixed;inset-inline:0;top:58px;z-index:15;background:#b3261e;color:#fff;padding:8px var(--pad);font-size:.9rem;text-align:center}

/* sections */
.sec{padding:clamp(72px,12vw,180px) var(--pad)}
.sec-title{font-family:var(--display);font-weight:400;font-size:clamp(3rem,9vw,9rem);line-height:1.1;margin:0 0 clamp(32px,5vw,72px)}
.sub-title{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,4rem);line-height:1.2;margin:0 0 clamp(16px,2vw,28px)}
.empty{margin:0;font-size:1.2em;opacity:.75}
.note{font-size:.9rem;opacity:.75;margin:14px 0 0}

/* hero */
.hero{
  position:relative;isolation:isolate;
  min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;
  padding:calc(var(--pad) * 3) var(--pad) var(--pad);
  background:var(--bg1);color:var(--fg1);
}
.hero.has-cover{color:#fff}
.cover{position:absolute;inset:0;z-index:-1;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.cover img.on{opacity:1}
.cover::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dark,.4))}
.hero-in{position:relative}
.hero h1{font-family:var(--display);font-weight:400;font-size:min(32vw,26rem,34svh);line-height:.95;margin:0 0 clamp(28px,5vw,72px)}
.hero.has-cover h1{text-shadow:0 2px 28px rgba(0,0,0,.3)}
.line{display:block;overflow:hidden;padding-block:.14em;margin-block:-.14em}
.line>span{display:block;transform:translateY(115%);transition:transform 1.1s cubic-bezier(.16,.84,.24,1)}
.line:nth-child(2)>span{transition-delay:.12s}
html.ready .line>span{transform:none}
.hero-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero-meta p{margin:0;max-width:34ch}
.scroll{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none}
.scroll svg{width:28px;height:28px}

/* about */
.about{background:var(--bg2);color:var(--fg2)}
.about-grid{display:grid;grid-template-columns:1fr;gap:clamp(40px,6vw,96px)}
@media (min-width:900px){.about-grid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.statement{font-size:clamp(1.7rem,4.3vw,3.9rem);line-height:1.4;font-weight:500;margin:0;max-width:22em}
.facts{margin:0;align-self:end}
.facts>div{border-top:1px solid color-mix(in srgb,currentColor 35%,transparent);padding:16px 0}
.facts dt{font-size:.85em;opacity:.65}
.facts dd{margin:4px 0 0;font-weight:600;font-size:1.1em}
.qa{margin-top:clamp(56px,8vw,120px)}
.qa-edit{border-top:2px solid currentColor;padding:18px 0}
.qa-edit .proj-name{font-size:clamp(1.6rem,4vw,3rem)}
.qa-edit p{margin:8px 0 14px;max-width:40ch}

/* accordion */
.proj{border-top:2px solid currentColor}
.proj:last-child{border-bottom:2px solid currentColor}
.proj-btn{
  width:100%;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer;
  display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding:clamp(14px,2vw,28px) 0;
}
.proj-name{flex:1;font-family:var(--display);font-size:clamp(1.9rem,5.2vw,4.4rem);line-height:1.2;transition:transform .35s var(--ease)}
.proj-btn:hover .proj-name,.proj-btn:focus-visible .proj-name{transform:translateX(-2vw)}
.plus{width:clamp(20px,3vw,36px);height:clamp(20px,3vw,36px);flex:none;transition:transform .4s var(--ease)}
.proj.open .plus{transform:rotate(45deg)}
.proj-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.proj.open .proj-panel{grid-template-rows:1fr}
.proj-body{overflow:hidden;min-height:0}
.proj-body p{margin:0 0 clamp(24px,3vw,48px);max-width:36ch;font-size:1.2em}

/* stories */
.stories{background:var(--bg3);color:var(--fg3)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 clamp(24px,4vw,48px)}
.tabs button{font-weight:600;font-size:1rem;padding:8px 18px;border:2px solid currentColor;border-radius:999px;background:none;color:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg3);color:var(--bg3)}
.post{border-top:2px solid currentColor}
.post-list .post:last-child{border-bottom:2px solid currentColor}
.post-btn{width:100%;display:flex;align-items:center;gap:clamp(14px,2vw,28px);padding:clamp(14px,2vw,26px) 0;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer}
.post-thumb{width:clamp(64px,10vw,110px);aspect-ratio:1;object-fit:cover;flex:none}
.post-text{flex:1;display:block}
.post-title{display:block;font-family:var(--display);font-size:clamp(1.8rem,4.8vw,3.8rem);line-height:1.2;transition:transform .35s var(--ease)}
.post-btn:hover .post-title,.post-btn:focus-visible .post-title{transform:translateX(-2vw)}
.post-meta{display:block;margin-top:6px;font-size:.9rem}
.tag{display:inline-block;padding:0 10px;border:1.5px solid currentColor;border-radius:999px;font-size:.8rem;font-weight:600;line-height:1.7}
.pm{margin-inline-start:6px}
.row-tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 16px}
.pending-box{margin:0 0 clamp(32px,5vw,56px);padding:clamp(16px,3vw,28px);border:2px dashed currentColor}
.pending-box .sub-title{font-size:clamp(1.6rem,4vw,2.6rem)}
.pending-box .post-title{font-size:clamp(1.4rem,3.4vw,2.4rem)}

/* photos */
.photos{background:var(--bg2);color:var(--fg2)}
.masonry{columns:2;column-gap:clamp(10px,1.6vw,20px)}
@media (min-width:800px){.masonry{columns:3}}
.ph{break-inside:avoid;margin:0 0 clamp(10px,1.6vw,20px);position:relative}
.ph-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.ph-btn img{display:block;width:100%;height:auto}
.ph figcaption{margin-top:6px;font-size:.9rem;opacity:.85}
.ph-empty{display:grid;place-items:center;background:color-mix(in srgb,currentColor 14%,transparent);break-inside:avoid;margin:0 0 clamp(10px,1.6vw,20px)}
.ph-empty svg{width:22%;opacity:.5}

/* contact */
.contact{background:var(--bg1);color:var(--fg1)}
.contact h2{font-family:var(--display);font-weight:400;font-size:min(26vw,26rem);line-height:1.05;margin:0 0 clamp(16px,3vw,32px)}
.contact-intro{margin:0;max-width:30ch;font-size:1.2em}
.contact .add-btn{max-width:420px}
.links{list-style:none;margin:clamp(40px,6vw,80px) 0 0;padding:0}
.links a{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:20px 0;border-top:1px solid color-mix(in srgb,currentColor 40%,transparent);
  text-decoration:none;font-size:clamp(1.2rem,2.6vw,2rem);font-weight:500;
  transition:background .25s,color .25s,padding .25s var(--ease);
}
.links li:last-child a{border-bottom:1px solid color-mix(in srgb,currentColor 40%,transparent)}
.links a:hover,.links a:focus-visible{background:var(--fg1);color:var(--bg1);padding-inline:16px}
.links bdi{direction:ltr;unicode-bidi:isolate}
.link-edit{border-top:1px solid color-mix(in srgb,currentColor 40%,transparent);padding:16px 0;font-size:clamp(1.1rem,2.4vw,1.8rem)}
.le-top{display:flex;justify-content:space-between;gap:16px;font-weight:500}
.le-href{font-size:.8rem;margin:6px 0 10px;opacity:.8;text-align:left}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:24px var(--pad);font-size:.9rem;background:var(--bg1);color:var(--fg1);border-top:1px solid color-mix(in srgb,currentColor 40%,transparent)}
html.editing .foot{margin-bottom:84px}
.linkbtn{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0;opacity:.75}

/* shared small controls */
.tool{font-size:.85rem;font-weight:600;padding:6px 14px;min-height:36px;border:1.5px solid currentColor;border-radius:999px;background:none;color:inherit;cursor:pointer}
.tool.danger{opacity:.85}
.add-btn{display:block;width:100%;margin-top:20px;padding:14px 20px;border:2px dashed currentColor;border-radius:12px;background:none;color:inherit;font-size:1rem;font-weight:600;cursor:pointer}
.add-btn.light{color:var(--ui);margin-top:12px}

/* edit mode */
html.editing [data-path]{outline:2px dashed color-mix(in srgb,currentColor 45%,transparent);outline-offset:4px;min-height:1em;cursor:text}
html.editing [data-path]:focus{outline-style:solid}
html.editing [data-path]:empty::before{content:attr(data-ph);opacity:.5}
.fab{position:fixed;z-index:60;inset-inline-end:16px;bottom:16px;min-height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--ui);color:var(--ui-fg);font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.bar{display:none;position:fixed;z-index:60;inset-inline:0;bottom:0;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px var(--pad);background:var(--ui);color:var(--ui-fg);font-size:.95rem}
html.editing .bar{display:flex}
.bar .status{font-weight:500}
.bar.warn .status{color:#f0c14b}
.bar-btns{display:flex;gap:8px;flex-wrap:wrap}
.bar button,.dlg-in button:not(.add-btn):not(.tool):not(.preset){min-height:44px;padding:0 16px;border:1.5px solid currentColor;border-radius:10px;background:none;color:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
.bar .primary{background:#d9a62e;border-color:#d9a62e;color:#161614}
.toast{position:fixed;z-index:200;inset-inline:16px;bottom:90px;margin-inline:auto;width:fit-content;max-width:min(92vw,460px);padding:12px 18px;border-radius:12px;background:var(--ui);color:var(--ui-fg);font-size:.95rem;text-align:center;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:none}

/* dialogs */
dialog{border:0;padding:0;font:inherit}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog.sheet{width:min(600px,100%);max-width:100%;max-height:92dvh;margin:auto;border-radius:18px;background:#f5f3ee;color:var(--ui);overflow:auto}
@media (max-width:640px){dialog.sheet{margin:auto 0 0;border-radius:18px 18px 0 0}}
.dlg-in{padding:22px var(--pad)}
.dlg-in h3{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 12px;line-height:1.2}
.dlg-in h4{font-size:1rem;margin:22px 0 8px}
.hint{margin:0 0 10px;font-size:.9rem;opacity:.7}
.err{margin:0 0 12px;color:#b3261e;font-weight:600;font-size:.95rem}
.fld{display:grid;gap:6px;margin:0 0 16px;font-weight:600;font-size:.95rem}
.fld input,.fld textarea{width:100%;font:inherit;font-weight:400;font-size:1rem;padding:12px;border:1.5px solid var(--ui);border-radius:8px;background:#fff;color:var(--ui)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ev{display:none}
dialog[data-type="event"] .ev{display:grid}
.seg{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:inline-block;padding:8px 18px;border:2px solid var(--ui);border-radius:999px;font-weight:600;cursor:pointer}
.seg input:checked+span{background:var(--ui);color:var(--ui-fg)}
.seg input:focus-visible+span{outline:3px solid #d9a62e;outline-offset:2px}
.ed-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.ed-actions .primary{background:var(--ui);color:var(--ui-fg)}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.preset{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px;border:1.5px solid var(--ui);border-radius:10px;background:#fff;color:var(--ui);font-size:.85rem;font-weight:600;cursor:pointer}
.sw{display:flex;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.25)}
.sw i{display:block;width:22px;height:22px}
.pickers{display:grid;gap:10px}
.pick{display:flex;align-items:center;gap:12px;font-weight:600;font-size:.95rem}
.pick input{width:56px;height:44px;padding:2px;border:1.5px solid var(--ui);border-radius:8px;background:#fff;flex:none}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cv{display:grid;gap:6px;justify-items:start}
.cv img,.pimg img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;display:block}
.pimg{display:grid;gap:8px;max-width:320px}
input[type=range]{width:100%;accent-color:var(--ui)}

dialog.reader{width:100%;max-width:none;height:100%;max-height:none;margin:0;background:var(--bg3);color:var(--fg3);overflow:auto}
.rd{max-width:760px;margin:0 auto;padding:80px var(--pad) 64px}
.rd img{display:block;width:100%;height:auto;max-height:60dvh;object-fit:cover;margin:0 0 24px}
.rd h2{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6vw,4.5rem);line-height:1.15;margin:12px 0 24px}
.rd-body p{margin:0 0 1.2em;font-size:1.15em;line-height:1.9}
.x{position:fixed;z-index:5;top:14px;inset-inline-start:14px;width:46px;height:46px;border:0;border-radius:50%;background:var(--fg3);color:var(--bg3);font-size:1.7rem;line-height:1;cursor:pointer}
dialog.viewer{width:100%;max-width:none;height:100%;max-height:none;margin:0;background:#000;color:#fff}
dialog.viewer[open]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 12px}
.viewer img{max-width:100%;max-height:100%;min-height:0;object-fit:contain}
.viewer p{margin:0;text-align:center}
.viewer .x{background:#fff;color:#000}
.vnav{position:fixed;inset-inline:0;bottom:14px;display:flex;justify-content:center;gap:16px}
.vnav button{width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:#000;font-size:1.8rem;line-height:1;cursor:pointer}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .spin{animation:none}
  .line>span,.proj-panel,.proj-name,.post-title,.plus,.loader,.cover img,.toast{transition:none}
}
</style>
<style id="theme-vars"></style>
<noscript><style>.loader{display:none}.line>span{transform:none}html.loading,html.loading body{overflow:auto}</style></noscript>

function merge(d,s){
  if(!s||typeof s!=='object')return d;
  for(var k in s){
    if(!Object.prototype.hasOwnProperty.call(s,k)||k==='__proto__'||k==='constructor')continue;
    var a=d[k],b=s[k];
    if(a&&typeof a==='object'&&!Array.isArray(a)&&b&&typeof b==='object'&&!Array.isArray(b))merge(a,b);else d[k]=b;
  }
  return d;
}

function fgFor(bg){var L=lum(bg),D='#1c1d1a',W='#f5f3ee';return((L+.05)/(lum(D)+.05))>=((lum(W)+.05)/(L+.05))?D:W}

/* ---------- saving (debounced, with status) ---------- */
var q={timers:0,inflight:0,error:false},timers={};
function statusText(){return q.inflight?'جاري الحفظ...':q.timers?'تغييرات قيد الحفظ...':q.error?'تعذّر الحفظ، تأكد من الاتصال':'تم الحفظ'}
function updateBar(){
  var s=$('status');if(!s)return;
  s.textContent=statusText();
  $('bar').classList.toggle('warn',!!(q.inflight||q.timers||q.error));
  var n=pendingPosts().length;
  $('revbtn').textContent=n?'مراجعة ('+new Intl.NumberFormat('ar-EG').format(n)+')':'مراجعة';
}
async function run(fn){
  q.inflight++;updateBar();
  var ok=false;
  try{ok=await fn()}catch(e){ok=false}
  q.inflight--;q.error=!ok;
  if(!ok)toast('تعذّر الحفظ. تأكد من الاتصال ثم جرّب مرة ثانية.');
  updateBar();
  return ok;
}
function debounce(key,fn,ms){
  if(timers[key]){clearTimeout(timers[key].t)}else{q.timers++}
  timers[key]={fn:fn,t:setTimeout(function(){delete timers[key];q.timers--;run(fn)},ms)};
  updateBar();
}
function flush(){
  Object.keys(timers).forEach(function(k){var x=timers[k];clearTimeout(x.t);delete timers[k];q.timers--;run(x.fn)});
}

/* ---------- images ---------- */
function readImage(file,maxSide,quality){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('decode'))};
      im.onload=function(){
        var s=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
        var w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',quality);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function upload(blob,folder){
  var path=folder+'/'+uid()+'.jpg';
  var r=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(r.error)return null;
  var u=sb.storage.from('media').getPublicUrl(path);
  return{path:path,url:u.data.publicUrl};
}
function removeFiles(urls){
  var paths=urls.map(pathFromUrl).filter(Boolean);
  if(paths.length&&sb)sb.storage.from('media').remove(paths).then(function(){},function(){});
}
function pickFiles(kind){ui.fileFor=kind;var f=$('file');f.multiple=(kind==='photos');f.value='';f.click()}
async function onFiles(files){
  var kind=ui.fileFor;if(!files.length||!kind)return;
  var max=kind==='cover'?1800:kind==='photos'?1600:1200;
  if(kind==='post'||kind==='submit'){
    try{var b=await readImage(files[0],max,.8);if(edPost){edPost._blob=b;edPost.image='';refreshEditorImg()}}catch(e){toast('تعذّرت قراءة الصورة.')}
    return;
  }
  var added=0,failed=0;
  for(var i=0;i<files.length;i++){
    toast('جاري رفع الصور ('+(i+1)+' من '+files.length+')...');
    var blob;try{blob=await readImage(files[i],max,.8)}catch(e){failed++;continue}
    var up=await upload(blob,kind==='cover'?'covers':'photos');
    if(!up){failed++;continue}
    if(kind==='photos'){
      var r=await sb.from('photos').insert({url:up.url,caption:''}).select().single();
      if(r.error||!r.data){failed++;removeFiles([up.url]);continue}
      photos.push({id:r.data.id,url:r.data.url,cap:''});
    }else{
      site.cover.imgs.push(up.url);queueSettings();
    }
    added++;
  }
  if(added){if(kind==='photos')renderSec('photos');else{renderSec('hero');refreshSettings()}}
  toast(failed?'تعذّر رفع '+failed+' من الصور. تأكد من الاتصال وحجم الصورة.':added?'تمت إضافة الصور.':'ما تمت إضافة شيء.');
}

async function savePost(approveToo){
  var title=$('p-title').value.trim();
  if(!title){toast('اكتب العنوان أولاً');$('p-title').focus();return}
  var r=document.querySelector('#editor input[name="ptype"]:checked');
  edPost.type=r?r.value:'story';
  edPost.title=title;edPost.author=$('p-author').value.trim();
  edPost.date=$('p-date').value;
  edPost.time=edPost.type==='event'?$('p-time').value:'';
  edPost.place=edPost.type==='event'?$('p-place').value.trim():'';
  edPost.body=$('p-body').value;
  var old=posts.filter(function(x){return x.id===edPost.id})[0];
  var oldImage=old?old.image:'';
  toast('جاري الحفظ...');
  if(edPost._blob){
    var up=await upload(edPost._blob,'posts');
    if(!up){toast('تعذّر رفع الصورة. جرّب مرة ثانية.');return}
    edPost.image=up.url;
  }
  var row=toRow(edPost),res;
  if(edPost._new){
    row.status='approved';
    res=await sb.from('posts').insert(row).select().single();
  }else{
    if(approveToo)row.status='approved';
    res=await sb.from('posts').update(row).eq('id',edPost.id).select().single();
  }
  if(res.error||!res.data){toast('تعذّر الحفظ. تأكد من الاتصال ثم جرّب.');return}
  var saved=fromRow(res.data);
  if(edPost._new)posts.push(saved);else posts=posts.map(function(x){return x.id===saved.id?saved:x});
  if(oldImage&&oldImage!==saved.image)removeFiles([oldImage]);
  edPost=null;$('editor').close();renderSec('stories');
  toast(saved.status==='approved'?'تم النشر.':'تم الحفظ.');
}
async function approvePost(id){
  var r=await sb.from('posts').update({status:'approved'}).eq('id',id).select().single();
  if(r.error||!r.data){toast('تعذّر القبول. جرّب مرة ثانية.');return}
  posts=posts.map(function(x){return x.id===id?fromRow(r.data):x});
  renderSec('stories');toast('تم قبول المشاركة ونشرها.');
}
async function deletePost(id){
  var p=posts.filter(function(x){return x.id===id})[0];
  var r=await sb.from('posts').delete().eq('id',id).select('id');
  if(r.error||!r.data||!r.data.length){toast('تعذّر الحذف. جرّب مرة ثانية.');return}
  posts=posts.filter(function(x){return x.id!==id});
  if(p&&p.image)removeFiles([p.image]);
  renderSec('stories');toast('تم الحذف.');
}

/* ---------- loading data ---------- */
function loadLib(){
  return new Promise(function(res){
    if(window.supabase)return res(true);
    var urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2'];
    (function next(i){
      if(i>=urls.length)return res(false);
      var s=document.createElement('script');s.src=urls[i];
      s.onload=function(){res(!!window.supabase)};
      s.onerror=function(){s.remove();next(i+1)};
      document.head.appendChild(s);
    })(0);
  });
}
async function loadData(){
  var s=await sb.from('site_settings').select('data').eq('id',1).maybeSingle();
  if(!s.error&&s.data&&s.data.data&&typeof s.data.data==='object')site=merge(defaults(),s.data.data);
  var p=await sb.from('posts').select('*').order('created_at',{ascending:false});
  if(!p.error&&p.data)posts=p.data.map(fromRow);
  var h=await sb.from('photos').select('*').order('created_at',{ascending:true});
  if(!h.error&&h.data)photos=h.data.map(function(r){return{id:r.id,url:r.url,cap:r.caption||''}});
  return !s.error&&!p.error&&!h.error;
}
async function initBackend(){
  if(!CONFIGURED)return;
  var ok=await loadLib();
  if(!ok){return}
  try{
    sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
    await loadData();
    renderAll();
    var sess=await sb.auth.getSession();
    if(sess&&sess.data&&sess.data.session){
      var isAdmin=await checkAdmin();
      if(isAdmin)renderAll();
    }
  }catch(e){sb=null}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var close=t.closest&&t.closest('[data-close]');
  if(close){var dl=close.closest('dialog');if(dl)dl.close();return}
  var a=t.closest&&t.closest('[data-act]');
  if(!a)return;
  var act=a.dataset.act,i=+a.dataset.i,id=a.dataset.id;
  if(!sb&&act!=='tab'&&act!=='qa-toggle'&&act!=='photo-open'&&act!=='v-prev'&&act!=='v-next'&&act!=='post-open'){toast('الموقع غير متصل بقاعدة البيانات الآن.');return}
  switch(act){
    case'tab':ui.tab=a.dataset.tab;renderSec('stories');break;
    case'qa-toggle':{
      var art=a.closest('.proj'),willOpen=!art.classList.contains('open');
      [].forEach.call(app.querySelectorAll('.qa .proj'),function(p){
        var o=p===art&&willOpen;
        p.classList.toggle('open',o);
        p.querySelector('.proj-btn').setAttribute('aria-expanded',o?'true':'false');
        p.querySelector('.proj-body').inert=!o;
      });
      break;
    }
    case'post-open':openReader(id);break;
    case'photo-open':showPhoto(i);openDlg($('viewer'));break;
    case'v-prev':showPhoto(ui.vi-1);break;
    case'v-next':showPhoto(ui.vi+1);break;
    case'login':{var d=$('login');d.innerHTML=loginHTML();openDlg(d);break}
    case'login-go':doLogin();break;
    case'logout':logout();break;
    case'edit-on':enterEdit();break;
    case'edit-off':exitEdit();break;
    case'settings':openSettings();break;
    case'review':{var pe=$('pending')||$('stories');if(pe)pe.scrollIntoView();break}
    case'submit-open':openSubmit();break;
    case'submit-img':pickFiles('submit');break;
    case'submit-send':sendSubmission();break;
    case'post-add':$('reader').close();openEditor(null);break;
    case'post-edit':$('reader').close();openEditor(id);break;
    case'post-approve':$('reader').close();approvePost(id);break;
    case'post-del':if(confirmTap('p'+id,'اضغط حذف مرة ثانية للتأكيد')){$('reader').close();deletePost(id)}break;
    case'post-img':pickFiles('post');break;
    case'post-img-del':edPost._blob=null;edPost.image='';refreshEditorImg();break;
    case'post-save':savePost(false);break;
    case'post-save-approve':savePost(true);break;
    case'photo-add':pickFiles('photos');break;
    case'photo-del':
      if(confirmTap('ph'+i)){
        var ph=photos[i];
        sb.from('photos').delete().eq('id',ph.id).select('id').then(function(r){
          if(r.error||!r.data||!r.data.length){toast('تعذّر حذف الصورة.');return}
          photos=photos.filter(function(x){return x.id!==ph.id});removeFiles([ph.url]);renderSec('photos');
        });
      }
      break;
    case'cover-add':pickFiles('cover');break;
    case'cover-del':if(confirmTap('cv'+i)){var gone=site.cover.imgs.splice(i,1);removeFiles(gone);queueSettings();renderSec('hero');refreshSettings()}break;
    case'preset':{
      var p=PRESETS[i];site.theme={c1:p.c[0],c2:p.c[1],c3:p.c[2]};applyTheme();queueSettings();
      [].forEach.call(document.querySelectorAll('#settings [data-color]'),function(inp){inp.value=site.theme[inp.dataset.color]});
      break;
    }
    case'fact-add':site.about.facts.push({k:'عنوان',v:'قيمة'});queueSettings();renderSec('about');break;
    case'fact-del':site.about.facts.splice(i,1);queueSettings();renderSec('about');break;
    case'qa-add':site.about.qa.push({q:'سؤال جديد؟',a:''});queueSettings();renderSec('about');break;
    case'qa-del':if(confirmTap('qa'+i)){site.about.qa.splice(i,1);queueSettings();renderSec('about')}break;
    case'link-add':site.contact.links.push({k:'رابط',v:'',href:''});queueSettings();renderSec('contact');break;
    case'link-del':site.contact.links.splice(i,1);queueSettings();renderSec('contact');break;
  }
});

document.addEventListener('keydown',function(e){
  var t=e.target;
  if(ui.edit&&e.key==='Enter'&&t.hasAttribute&&t.hasAttribute('data-line')){e.preventDefault();t.blur();return}
  if(e.key==='Enter'&&(t.id==='l-email'||t.id==='l-pass')){e.preventDefault();doLogin();return}
  if($('viewer').open){if(e.key==='ArrowLeft')showPhoto(ui.vi+1);else if(e.key==='ArrowRight')showPhoto(ui.vi-1)}
});
document.addEventListener('paste',function(e){
  var t=e.target;
  if(ui.edit&&t.closest&&t.closest('[data-path]')){
    e.preventDefault();
    var tx=((e.clipboardData||window.clipboardData).getData('text/plain')||'');
    if(t.closest('[data-line]'))tx=tx.replace(/\s+/g,' ');
    document.execCommand('insertText',false,tx);
  }
});

/* ---------- boot ---------- */
buildChrome();
renderAll();
var dataReady=initBackend();

function reveal(){root.classList.remove('loading');root.classList.add('ready')}
if(reduce){
  reveal();
}else{
  var loader=document.createElement('div');
  loader.className='loader';loader.setAttribute('aria-hidden','true');
  loader.innerHTML='<div class="loader-row"><span>أهلاً</span>'+STAR+'<span>بكم</span></div><div class="count" id="count">٠٪</div>';
  document.body.appendChild(loader);
  var fmt=new Intl.NumberFormat('ar-EG');
  var finish=function(){
    Promise.race([dataReady,new Promise(function(r){setTimeout(r,6000)})]).then(function(){
      loader.classList.add('done');reveal();setTimeout(function(){loader.remove()},1300);
    });
  };
  var run2=function(){
    var start=null,dur=2000,count=$('count');
    var tick=function(ts){
      if(start===null)start=ts;
      var p=Math.min((ts-start)/dur,1),eased=1-Math.pow(1-p,2.2);
      count.textContent=fmt.format(Math.round(eased*100))+'٪';
      if(p<1)requestAnimationFrame(tick);else setTimeout(finish,250);
    };
    requestAnimationFrame(tick);
  };
  if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,2500)})]).then(run2);
  else run2();
}
})();
</script>
</body>
</html>
