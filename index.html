<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap"></noscript>
<style>
:root{
  --bg1:#d9a62e; --fg1:#1c1d1a;
  --bg2:#1c1d1a; --fg2:#f5f3ee;
  --bg3:#ecebe6; --fg3:#1c1d1a;
  --display:"Lalezar","Cairo","Tajawal",Impact,sans-serif;
  --display-lat:"Anton","Lalezar",Impact,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --pad:clamp(20px,4vw,64px);
  --ease:cubic-bezier(.2,.7,.2,1);
  --ui:#161614; --ui-fg:#f5f3ee;
  --r:14px; --btn-r:999px; --space:1; --scale:1; --tscale:1; --dir:1;
  --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:var(--nav-h);-webkit-text-size-adjust:100%}
html[dir="ltr"]{--dir:-1}
html.loading,html.loading body,html.modal,html.modal body,html.menuopen,html.menuopen body{overflow:hidden}
body{
  margin:0;background:var(--bg1);color:var(--fg1);
  font-family:var(--body);font-size:calc(clamp(1rem,.9rem + .5vw,1.2rem) * var(--scale) * var(--uscale,1));line-height:1.7;
  overflow-x:hidden;
}
a{color:inherit}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid currentColor;outline-offset:4px}
[data-path]{white-space:pre-line}
img{max-width:100%}

.spin{animation:spin 3.2s cubic-bezier(.6,0,.4,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:100;background:var(--bg2);color:var(--fg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4vw,48px);transition:transform 1s cubic-bezier(.76,0,.24,1)}
.loader.done{transform:translateY(-100%)}
.loader-row{display:flex;align-items:center;gap:clamp(10px,3vw,40px);font-family:var(--display);font-size:min(20vw,13rem);line-height:1.1}
html[lang="en"] .loader-row{font-family:var(--display-lat);font-size:min(13vw,9rem);text-transform:uppercase}
.loader-row svg{width:.8em;height:.8em;flex:none;color:var(--bg1)}
.count{font-size:.95rem;opacity:.7}

/* ---------- flag ---------- */
.flag-svg{display:block;width:100%;height:100%}
.flag-ico{display:inline-block;width:30px;height:20px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.flag-wave{position:absolute;z-index:2;inset-block-start:calc(var(--nav-h) + 22px);inset-inline-end:var(--pad);width:clamp(64px,9vw,110px);aspect-ratio:3/2;transform-origin:left center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));animation:wave 4.2s ease-in-out infinite alternate}
@keyframes wave{from{transform:perspective(500px) rotateY(-14deg) skewY(2deg)}to{transform:perspective(500px) rotateY(10deg) skewY(-2deg)}}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;inset-inline:0;z-index:20;height:var(--nav-h);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 var(--pad);background:var(--bg1);color:var(--fg1);box-shadow:0 1px 0 color-mix(in srgb,var(--fg1) 18%,transparent)}
html.hasflag .nav::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(#007a3d 0 33.4%,#fff 33.4% 66.7%,#000 66.7%)}
html.hasflag .nav{padding-top:6px}
.nav a,.nav button{text-decoration:none}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(1.25rem,4vw,1.7rem);line-height:1;white-space:nowrap}
html[lang="en"] .logo{font-family:var(--display-lat);font-size:clamp(1.1rem,3.4vw,1.45rem);letter-spacing:.04em;text-transform:uppercase}
.logo svg.spin{width:.8em;height:.8em;flex:none}
.nav-r{display:flex;align-items:center;gap:clamp(8px,2vw,22px)}
.nav ul{display:none;gap:clamp(14px,2vw,30px);list-style:none;margin:0;padding:0;font-weight:500;font-size:1rem;white-space:nowrap}
@media (min-width:1000px){.nav ul{display:flex}.menu-btn{display:none!important}}
.nav.compact ul{display:none}
.nav.compact .menu-btn{display:grid!important}
.nav-btn{min-width:44px;height:40px;padding:0 12px;border:2px solid currentColor;border-radius:var(--btn-r);background:none;color:inherit;font-size:.95rem;font-weight:700;cursor:pointer}
.menu-btn{display:grid;place-items:center;width:44px;height:40px;padding:0;border:2px solid currentColor;border-radius:var(--btn-r);background:none;color:inherit;cursor:pointer}
.menu-btn svg{width:22px;height:22px}
.menu{position:fixed;inset:0;z-index:90;background:var(--bg2);color:var(--fg2);display:flex;flex-direction:column;padding:calc(var(--nav-h) + 20px) var(--pad) 32px;overflow:auto;transform:translateY(-100%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
html.menuopen .menu{transform:none;visibility:visible;transition:transform .5s var(--ease)}
.menu a{display:block;font-family:var(--display);font-size:clamp(2.4rem,9vw,4.5rem);line-height:1.25;text-decoration:none;border-bottom:1px solid color-mix(in srgb,currentColor 25%,transparent);padding:6px 0}
html[lang="en"] .menu a{font-family:var(--display-lat);text-transform:uppercase}
.menu-x{position:absolute;inset-block-start:calc(6px + 10px);inset-inline-end:var(--pad);width:44px;height:40px;border:2px solid currentColor;border-radius:var(--btn-r);background:none;color:inherit;font-size:1.4rem;line-height:1;cursor:pointer}
.cfgwarn{position:fixed;inset-inline:0;top:var(--nav-h);z-index:15;background:#b3261e;color:#fff;padding:8px var(--pad);font-size:.9rem;text-align:center}

/* ---------- sections ---------- */
.sec{padding:calc(clamp(72px,12vw,180px) * var(--space)) var(--pad)}
.s-bg1{--sbg:var(--bg1);--sfg:var(--fg1);background:var(--bg1);color:var(--fg1)}
.s-bg2{--sbg:var(--bg2);--sfg:var(--fg2);background:var(--bg2);color:var(--fg2)}
.s-bg3{--sbg:var(--bg3);--sfg:var(--fg3);background:var(--bg3);color:var(--fg3)}
.al-center{text-align:center}
.al-center .sec-lead,.al-center .map-text{margin-inline:auto}
.sec-title{font-family:var(--display);font-weight:400;font-size:clamp(3rem,9vw,9rem);line-height:1.1;margin:0 0 clamp(32px,5vw,72px)}
html[lang="en"] .sec-title{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(2.6rem,7.5vw,7rem);letter-spacing:.01em}
.ts-s .sec-title{font-size:clamp(2rem,5vw,4.5rem)}
.ts-l .sec-title{font-size:clamp(3.6rem,12vw,12rem)}
html[lang="en"] .ts-s .sec-title{font-size:clamp(1.8rem,4.5vw,4rem)}
html[lang="en"] .ts-l .sec-title{font-size:clamp(3rem,10vw,10rem)}
.sub-title{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,4rem);line-height:1.2;margin:0 0 clamp(16px,2vw,28px)}
html[lang="en"] .sub-title{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.6rem,4vw,3.2rem)}
.sec-lead{margin:0 0 clamp(20px,3vw,36px);max-width:40em;font-size:1.15em;opacity:.9}
.empty{margin:0;font-size:1.2em;opacity:.75}
.note{font-size:.9rem;opacity:.75;margin:14px 0 0}
.ow-hint{border:2px dashed currentColor;border-radius:var(--r);padding:14px 18px;margin:0 0 20px;font-size:.95rem;opacity:.8}

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;justify-content:var(--hv,flex-end);align-items:var(--hh,flex-start);padding:calc(var(--nav-h) + var(--pad) * 1.6) var(--pad) var(--pad);background:var(--bg1);color:var(--fg1);text-align:var(--ha,start)}
.hero.h-tall{min-height:78svh}.hero.h-half{min-height:56svh}
.hero.has-cover{color:#fff}
.cover{position:absolute;inset:0;z-index:-1;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.cover img.on{opacity:1}
.cover::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dark,.4))}
.hero-in{position:relative;width:100%;max-width:100%}
.hero h1{font-family:var(--display);font-weight:400;font-size:min(26vw,30svh);line-height:.95;margin:0 0 clamp(14px,2vw,26px)}
html[lang="en"] .hero h1{font-family:var(--display-lat);text-transform:uppercase;font-size:min(16vw,30svh);line-height:.98;letter-spacing:.01em}
.hero.t-outline h1{color:transparent;-webkit-text-stroke:max(2px,.012em) var(--fg1)}
.hero.t-outline.has-cover h1{-webkit-text-stroke-color:#fff}
.hero.has-cover h1{text-shadow:0 2px 28px rgba(0,0,0,.3)}
.hero.t-outline.has-cover h1{text-shadow:none}
.line{display:block;overflow:hidden;padding-block:.14em;margin-block:-.14em}
.line>span{display:inline-block;vertical-align:top;white-space:nowrap;transform:translateY(115%);transition:transform 1.1s cubic-bezier(.16,.84,.24,1)}
.line:nth-child(2)>span{transition-delay:.12s}
html.ready .line>span{transform:none}
.brand2{display:flex;align-items:center;gap:14px;margin:0 0 clamp(22px,4vw,56px);font-family:var(--display-lat);font-size:clamp(1rem,3.2vw,2.2rem);letter-spacing:.34em;text-transform:uppercase;line-height:1.2}
html[lang="en"] .brand2{font-family:var(--display);letter-spacing:0;text-transform:none;font-size:clamp(1.4rem,4.4vw,3rem)}
.brand2 i{display:block;height:2px;width:clamp(28px,7vw,90px);background:currentColor;flex:none}
.hero.h-cn .brand2{justify-content:center}
.hero-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;width:100%}
.hero.h-cn .hero-meta{justify-content:center;flex-direction:column;align-items:center}
.hero-meta p{margin:0;max-width:34ch}
.scroll{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none}
.scroll svg{width:28px;height:28px}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1fr;gap:clamp(40px,6vw,96px)}
@media (min-width:900px){.about-grid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.statement{font-size:clamp(1.7rem,4.3vw,3.9rem);line-height:1.4;font-weight:500;margin:0;max-width:22em}
.facts{margin:0;align-self:end}
.facts>div{border-top:1px solid color-mix(in srgb,currentColor 35%,transparent);padding:16px 0}
.facts dt{font-size:.85em;opacity:.65}
.facts dd{margin:4px 0 0;font-weight:600;font-size:1.1em}
.qa{margin-top:clamp(56px,8vw,120px)}
.qa-edit{border-top:2px solid currentColor;padding:18px 0}
.qa-edit .proj-name{font-size:clamp(1.6rem,4vw,3rem)}
.qa-edit p{margin:8px 0 14px;max-width:40ch}

/* accordion */
.proj{border-top:2px solid currentColor}
.proj:last-child{border-bottom:2px solid currentColor}
.proj-btn{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer;display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding:clamp(14px,2vw,28px) 0}
.proj-name{flex:1;font-family:var(--display);font-size:clamp(1.9rem,5.2vw,4.4rem);line-height:1.2;transition:transform .35s var(--ease)}
html[lang="en"] .proj-name{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.5rem,4vw,3.3rem)}
.proj-btn:hover .proj-name,.proj-btn:focus-visible .proj-name{transform:translateX(calc(var(--dir) * -2vw))}
.plus{width:clamp(20px,3vw,36px);height:clamp(20px,3vw,36px);flex:none;transition:transform .4s var(--ease)}
.proj.open .plus{transform:rotate(45deg)}
.proj-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.proj.open .proj-panel{grid-template-rows:1fr}
.proj-body{overflow:hidden;min-height:0}
.proj-body p{margin:0 0 clamp(24px,3vw,48px);max-width:36ch;font-size:1.2em}

/* ---------- tabs / tags ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 clamp(24px,4vw,48px)}
.tabs button{font-weight:600;font-size:1rem;padding:8px 18px;border:2px solid currentColor;border-radius:var(--btn-r);background:none;color:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--sfg);color:var(--sbg)}
.tag{display:inline-block;padding:0 10px;border:1.5px solid currentColor;border-radius:var(--btn-r);font-size:.8rem;font-weight:600;line-height:1.7}
.tag.solid{background:var(--sfg);color:var(--sbg);border-color:var(--sfg)}
.pm{margin-inline-start:6px}

/* ---------- featured ---------- */
.feat-grid{display:grid;gap:clamp(14px,2vw,24px);grid-template-columns:1fr}
@media (min-width:800px){.feat-grid{grid-template-columns:repeat(3,1fr)}.feat-grid .fc:first-child{grid-column:span 2;grid-row:span 2}}
.fc{position:relative;display:flex;flex-direction:column;border:2px solid currentColor;border-radius:var(--r);overflow:hidden;background:none;color:inherit;text-align:start;padding:0;cursor:pointer;font:inherit}
.fc-img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:color-mix(in srgb,currentColor 12%,transparent)}
.fc:first-child .fc-img{aspect-ratio:16/11}
.fc-ph{display:grid;place-items:center;aspect-ratio:16/10;background:color-mix(in srgb,currentColor 10%,transparent)}
.fc-ph svg{width:22%;opacity:.4}
.fc-body{display:block;padding:clamp(14px,2vw,22px)}
.fc-title{display:block;font-family:var(--display);font-size:clamp(1.5rem,3vw,2.6rem);line-height:1.2;margin:8px 0 6px}
html[lang="en"] .fc-title{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.3rem,2.6vw,2.2rem)}
.fc:first-child .fc-title{font-size:clamp(1.9rem,4vw,3.6rem)}
.fc-ex{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:.95rem;opacity:.85}

/* ---------- stories ---------- */
.post{border-top:2px solid currentColor}
.post-list .post:last-child{border-bottom:2px solid currentColor}
.post-btn{width:100%;display:flex;align-items:center;gap:clamp(14px,2vw,28px);padding:clamp(14px,2vw,26px) 0;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer}
.post-thumb{width:clamp(64px,10vw,110px);aspect-ratio:1;object-fit:cover;flex:none;border-radius:var(--r)}
.post-text{flex:1;display:block}
.post-title{display:block;font-family:var(--display);font-size:clamp(1.8rem,4.8vw,3.8rem);line-height:1.2;transition:transform .35s var(--ease)}
html[lang="en"] .post-title{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.4rem,3.6vw,2.8rem)}
.post-btn:hover .post-title,.post-btn:focus-visible .post-title{transform:translateX(calc(var(--dir) * -2vw))}
.post-meta{display:block;margin-top:6px;font-size:.9rem}
.row-tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 16px}
.pending-box{margin:0 0 clamp(32px,5vw,56px);padding:clamp(16px,3vw,28px);border:2px dashed currentColor;border-radius:var(--r)}
.pending-box .sub-title{font-size:clamp(1.6rem,4vw,2.6rem)}
.pending-box .post-title{font-size:clamp(1.4rem,3.4vw,2.4rem)}

/* people cards */
.people{display:grid;gap:clamp(12px,2vw,22px);grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.people{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.people{grid-template-columns:repeat(4,1fr)}}
.person{border:2px solid currentColor;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.person-btn{display:block;padding:0;border:0;background:none;color:inherit;text-align:center;cursor:pointer;font:inherit}
.person-img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .4s}
.person-btn:hover .person-img,.person-btn:focus-visible .person-img{filter:none}
.person-ph{display:grid;place-items:center;aspect-ratio:4/5;background:color-mix(in srgb,currentColor 10%,transparent)}
.person-ph svg{width:30%;opacity:.35}
.person-name{display:block;padding:12px 10px 2px;font-family:var(--display);font-size:clamp(1.3rem,2.4vw,1.9rem);line-height:1.25}
html[lang="en"] .person-name{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.1rem,2vw,1.6rem)}
.person-dates{display:block;padding:0 10px 12px;font-size:.9rem;opacity:.8}
.person .row-tools{padding:0 10px 12px;justify-content:center}

/* ---------- photos / video ---------- */
.masonry{columns:2;column-gap:clamp(10px,1.6vw,20px)}
@media (min-width:800px){.masonry{columns:3}}
.ph{break-inside:avoid;margin:0 0 clamp(10px,1.6vw,20px);position:relative}
.ph-btn{position:relative;display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:var(--r);overflow:hidden;color:inherit}
.ph-btn img{display:block;width:100%;height:auto}
.ph-vph{display:grid;place-items:center;aspect-ratio:16/9;background:color-mix(in srgb,currentColor 16%,transparent)}
.ph-play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.ph-play span{display:grid;place-items:center;width:clamp(48px,7vw,72px);aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.ph-play svg{width:42%;margin-inline-start:6%}
.ph figcaption{margin-top:6px;font-size:.9rem;opacity:.85}
.ph-vph svg{width:22%;opacity:.55;color:#fff}
.ph-vph{background:linear-gradient(135deg,var(--bg1),var(--bg2))!important}
.tool[aria-pressed="true"]{background:var(--sfg);color:var(--sbg);border-color:var(--sfg)}
.intro-grid{display:grid;gap:clamp(24px,4vw,64px);align-items:center}
@media (min-width:900px){.intro-grid{grid-template-columns:minmax(0,1fr) auto}}
.intro-copy .sec-title{margin-bottom:clamp(16px,2.5vw,28px)}
.intro-card{position:relative;display:block;width:min(100%,380px);padding:0;border:0;background:#000;border-radius:var(--r);overflow:hidden;cursor:pointer;justify-self:center;box-shadow:0 18px 44px rgba(0,0,0,.28)}
.intro-card img{display:block;width:100%;height:auto;max-height:72svh;object-fit:cover}
.intro-ph{display:grid;place-items:center;aspect-ratio:9/16;color:#fff;background:linear-gradient(135deg,var(--bg1),var(--bg2))}
.intro-ph svg{width:26%;opacity:.5}
.ph-play.big span{width:clamp(64px,14vw,92px)}
.ph-empty{display:grid;place-items:center;background:color-mix(in srgb,currentColor 14%,transparent);break-inside:avoid;margin:0 0 clamp(10px,1.6vw,20px);border-radius:var(--r)}
.ph-empty svg{width:22%;opacity:.5}
.ph-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ---------- map ---------- */
.s-map{padding:0}
.map-shell{position:relative}
#mapbox{position:relative;height:min(84svh,760px);min-height:420px;overflow:hidden;isolation:isolate;background:color-mix(in srgb,var(--bg1) 75%,#fff);direction:ltr;touch-action:pan-x pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
#mapbox.drag{cursor:grabbing}
.mm-tiles{position:absolute;inset:0;overflow:hidden}
.map-duo .mm-tiles{mix-blend-mode:multiply;filter:grayscale(1) contrast(1.15)}
.map-mono .mm-tiles{filter:grayscale(1) contrast(1.05)}
.map-sat .mm-tiles{mix-blend-mode:normal;filter:none}
.mm-tile{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;opacity:0;transition:opacity .25s;-webkit-user-drag:none;pointer-events:none}
.mm-tile.in{opacity:1}
.mm-vig{position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 90px color-mix(in srgb,var(--bg2) 38%,transparent)}
.mm-pin,.mm-poi{position:absolute;left:0;top:0;width:0;height:0;z-index:2}
.mm-pin{pointer-events:none}
.pin-ring,.pin-dot{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%}
.pin-ring{border:2px solid var(--bg2);animation:ring 2.4s ease-out infinite}
.pin-dot{background:var(--bg2);color:var(--bg1);display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.4);border:3px solid var(--bg1)}
.pin-dot svg{width:56%;height:56%}
.pin-label{position:absolute;left:0;bottom:32px;transform:translateX(-50%);white-space:nowrap;direction:rtl;font-family:var(--display);font-size:1.3rem;line-height:1.4;padding:0 16px;background:var(--bg2);color:var(--fg2);box-shadow:0 3px 12px rgba(0,0,0,.3);border-radius:var(--r)}
html[lang="en"] .pin-label{direction:ltr;font-family:var(--display-lat);text-transform:uppercase;letter-spacing:.06em;font-size:1.1rem}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(2);opacity:0}}
.poi-b{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:2px solid var(--bg2);background:var(--bg1);color:var(--fg1);display:grid;place-items:center;font-size:15px;line-height:1;cursor:pointer;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.poi-l{position:absolute;left:0;bottom:22px;transform:translateX(-50%);white-space:nowrap;direction:rtl;background:var(--bg2);color:var(--fg2);font-size:.8rem;font-weight:600;padding:0 9px;border-radius:var(--r);pointer-events:none;opacity:0;transition:opacity .2s}
html[lang="en"] .poi-l{direction:ltr}
.mm-poi.on .poi-l,.mm-poi:hover .poi-l,.mm-z .poi-l{opacity:1}
.mm-ctl{position:absolute;right:12px;top:12px;display:grid;gap:6px;z-index:3}
html[dir="rtl"] .mm-ctl{right:auto;left:12px}
.mm-ctl button{width:44px;height:44px;border:2px solid var(--fg1);background:var(--bg1);color:var(--fg1);font-size:1.5rem;line-height:1;cursor:pointer;border-radius:var(--r)}
.mm-attr{position:absolute;right:0;bottom:0;z-index:3;background:rgba(255,255,255,.8);color:#222;font-size:11px;line-height:1.5;padding:0 6px;direction:ltr}
.mm-attr a{color:inherit}
.mm-hint,.map-note{position:absolute;z-index:4;left:50%;transform:translateX(-50%);max-width:88%;text-align:center;background:var(--ui);color:var(--ui-fg);padding:8px 16px;font-size:.9rem;pointer-events:none;border-radius:var(--r)}
.mm-hint{bottom:34px;opacity:0;transition:opacity .25s}
.mm-hint.show{opacity:1}
.map-note{top:12px;pointer-events:auto}
.map-card{position:relative;background:var(--sbg);color:var(--sfg);padding:clamp(18px,3vw,30px) var(--pad) clamp(28px,4vw,48px);border-top:2px solid var(--sfg)}
@media (min-width:900px){
  .map-card{position:absolute;z-index:5;inset-block-start:clamp(16px,3vw,36px);inset-inline-start:clamp(16px,3vw,36px);width:min(400px,38%);padding:clamp(18px,2vw,28px);border:2px solid var(--sfg);border-radius:var(--r);box-shadow:8px 8px 0 color-mix(in srgb,var(--sfg) 88%,transparent);max-height:calc(100% - 2*clamp(16px,3vw,36px));overflow:auto}
  html[dir="rtl"] .map-card{box-shadow:-8px 8px 0 color-mix(in srgb,var(--sfg) 88%,transparent)}
}
.map-card .sec-title{font-size:clamp(2.4rem,4.4vw,4rem);margin:0 0 12px}
html[lang="en"] .map-card .sec-title{font-size:clamp(2rem,3.6vw,3.2rem)}
.map-text{margin:0 0 16px;font-size:1.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border:1.5px solid currentColor;border-radius:var(--btn-r);font-size:.85rem;font-weight:600;background:none;color:inherit;font-family:inherit}
button.chip{cursor:pointer}
.map-card .tabs{margin:0 0 14px}
.map-card .tabs button{padding:6px 14px;font-size:.9rem}
.map-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.map-links a.tool{display:inline-flex;align-items:center;text-decoration:none}
.map-links bdi{direction:ltr;unicode-bidi:isolate;font-size:.85rem;opacity:.75}
.poi-list{margin:0 0 4px}
.poi-list h3{font-size:.85rem;margin:0 0 8px;opacity:.7;font-weight:600}

/* ---------- reviews ---------- */
.rev-grid{display:grid;gap:clamp(28px,5vw,64px);grid-template-columns:1fr}
@media (min-width:900px){.rev-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}}
.rev-sum{display:flex;align-items:center;gap:20px;margin:0 0 20px}
.rev-big{font-family:var(--display);font-size:clamp(4.5rem,10vw,8rem);line-height:1}
html[lang="en"] .rev-big{font-family:var(--display-lat)}
.stars{display:inline-flex;gap:2px;direction:ltr}
.stars svg{width:1.15em;height:1.15em}
.rev-bars{display:grid;gap:4px;margin:0 0 24px;max-width:340px}
.rev-bar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.rev-bar i{display:block;height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 18%,transparent);overflow:hidden}
.rev-bar i b{display:block;height:100%;background:currentColor}
.rev-item{border-top:2px solid currentColor;padding:18px 0}
.rev-item:last-child{border-bottom:2px solid currentColor}
.rev-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rev-name{font-weight:700;font-size:1.1em}
.rev-date{font-size:.85rem;opacity:.7}
.rev-text{margin:0;max-width:52ch;white-space:pre-line}
.rev-form{border:2px solid currentColor;border-radius:var(--r);padding:clamp(16px,2.5vw,26px)}
.rev-form h3{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3vw,2.4rem);margin:0 0 12px}
html[lang="en"] .rev-form h3{font-family:var(--display-lat);text-transform:uppercase}
.starpick{display:flex;gap:4px;direction:ltr;margin:0 0 14px}
.starpick button{border:0;background:none;color:inherit;padding:2px;cursor:pointer;opacity:.35}
.starpick button.on{opacity:1}
.starpick svg{width:36px;height:36px;display:block}
.rev-form label{display:grid;gap:4px;margin:0 0 12px;font-weight:600;font-size:.95rem}
.rev-form input,.rev-form textarea{width:100%;font:inherit;font-weight:400;font-size:1rem;padding:10px 12px;border:2px solid currentColor;border-radius:var(--r);background:transparent;color:inherit}
.rev-form .err{color:inherit;font-weight:700}

/* ---------- contact / blocks ---------- */
.contact h2{font-family:var(--display);font-weight:400;font-size:min(26vw,26rem);line-height:1.05;margin:0 0 clamp(16px,3vw,32px)}
html[lang="en"] .contact h2{font-family:var(--display-lat);text-transform:uppercase;font-size:min(16vw,18rem)}
.contact-intro{margin:0;max-width:30ch;font-size:1.2em}
.contact .add-btn{max-width:420px}
.links{list-style:none;margin:clamp(40px,6vw,80px) 0 0;padding:0}
.links a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;border-top:1px solid color-mix(in srgb,currentColor 40%,transparent);text-decoration:none;font-size:clamp(1.2rem,2.6vw,2rem);font-weight:500;transition:background .25s,color .25s,padding .25s var(--ease)}
.links li:last-child a{border-bottom:1px solid color-mix(in srgb,currentColor 40%,transparent)}
.links a:hover,.links a:focus-visible{background:var(--sfg);color:var(--sbg);padding-inline:16px}
.links bdi{direction:ltr;unicode-bidi:isolate}
.link-edit{border-top:1px solid color-mix(in srgb,currentColor 40%,transparent);padding:16px 0;font-size:clamp(1.1rem,2.4vw,1.8rem)}
.le-top{display:flex;justify-content:space-between;gap:16px;font-weight:500}
.le-href{font-size:.8rem;margin:6px 0 10px;opacity:.8;text-align:left}
.blk{display:grid;gap:clamp(24px,4vw,56px);grid-template-columns:1fr;align-items:center}
@media (min-width:900px){.blk.has-img{grid-template-columns:1fr 1fr}}
.blk-text{font-size:1.2em;max-width:40em;margin:0}
.blk img{display:block;width:100%;border-radius:var(--r);height:auto}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:24px var(--pad);font-size:.9rem;background:var(--bg1);color:var(--fg1);border-top:1px solid color-mix(in srgb,currentColor 40%,transparent)}
.foot-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.foot .emblem{height:42px;width:auto}
html.editing .foot{margin-bottom:84px}
.linkbtn{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0;opacity:.75}

/* ---------- shared controls ---------- */
.tool{font-size:.85rem;font-weight:600;padding:6px 14px;min-height:36px;border:1.5px solid currentColor;border-radius:var(--btn-r);background:none;color:inherit;cursor:pointer;font-family:inherit}
.tool.danger{opacity:.85}
.tool.on{background:currentColor}
.tool.on>span{color:var(--sbg,#fff)}
.add-btn{display:block;width:100%;margin-top:20px;padding:14px 20px;border:2px dashed currentColor;border-radius:var(--r);background:none;color:inherit;font-size:1rem;font-weight:600;cursor:pointer}
.add-btn.light{color:var(--ui);margin-top:12px}

/* ---------- edit mode chrome ---------- */
html.editing [data-path]{outline:2px dashed color-mix(in srgb,currentColor 45%,transparent);outline-offset:4px;min-height:1em;cursor:text}
html.editing [data-path]:focus{outline-style:solid}
html.editing [data-path]:empty::before{content:attr(data-ph);opacity:.5}
.fab{position:fixed;z-index:60;inset-inline-end:16px;bottom:16px;min-height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--ui);color:var(--ui-fg);font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.bar{display:none;position:fixed;z-index:60;inset-inline:0;bottom:0;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px var(--pad);background:var(--ui);color:var(--ui-fg);font-size:.95rem;direction:rtl}
html.editing .bar{display:flex}
.bar .status{font-weight:500;font-size:.85rem}
.bar.warn .status{color:#f0c14b}
.bar-btns{display:flex;gap:6px;flex-wrap:nowrap;flex:1;justify-content:flex-end}
.bar-btns .primary{margin-inline-start:auto}
@media (max-width:700px){.bar{padding:8px 10px;gap:6px}.bar-btns{width:100%;flex:none;flex-wrap:wrap}.bar .bar-btns button{padding:0 7px;font-size:.8rem;min-height:40px;white-space:nowrap}.bar-btns{gap:5px}.bar .bar-btns button:not(.primary){flex:1 1 auto}}
.bar button,.ed-actions button{min-height:44px;padding:0 16px;border:1.5px solid currentColor;border-radius:10px;background:none;color:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
.bar .primary{background:#d9a62e;border-color:#d9a62e;color:#161614}
.toast{position:fixed;z-index:200;inset-inline:16px;bottom:90px;margin-inline:auto;width:fit-content;max-width:min(92vw,460px);padding:12px 18px;border-radius:12px;background:var(--ui);color:var(--ui-fg);font-size:.95rem;text-align:center;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:none}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;font:inherit}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog.sheet{width:min(680px,100%);max-width:100%;max-height:92dvh;margin:auto;border-radius:18px;background:#f5f3ee;color:var(--ui);overflow:auto}
dialog.sheet.owner{direction:rtl;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
@media (max-width:700px){dialog.sheet{margin:auto 0 0;border-radius:18px 18px 0 0}}
.dlg-in{padding:22px var(--pad)}
.dlg-in h3{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 12px;line-height:1.2}
html[lang="en"] dialog.sheet:not(.owner) .dlg-in h3{font-family:var(--display-lat);text-transform:uppercase}
.dlg-in h4{font-size:1rem;margin:22px 0 8px}
.hint{margin:0 0 10px;font-size:.9rem;opacity:.7}
.err{margin:0 0 12px;color:#b3261e;font-weight:600;font-size:.95rem}
.fld{display:grid;gap:6px;margin:0 0 16px;font-weight:600;font-size:.95rem}
.fld input,.fld textarea,.fld select{width:100%;font:inherit;font-weight:400;font-size:1rem;padding:12px;border:1.5px solid var(--ui);border-radius:8px;background:#fff;color:var(--ui)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k-only{display:none}
dialog[data-kind="event"] .k-event,dialog[data-kind="people"] .k-people{display:grid}
dialog[data-kind="people"] .k-nopeople{display:none}
.seg{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.seg-b{padding:8px 16px;border:2px solid var(--ui);border-radius:999px;background:#fff;color:var(--ui);font-weight:600;font-size:.9rem;cursor:pointer;font-family:inherit}
.seg-b[aria-pressed="true"]{background:var(--ui);color:var(--ui-fg)}
.ed-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.ed-actions .primary{background:var(--ui);color:var(--ui-fg)}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.preset{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px;border:1.5px solid var(--ui);border-radius:10px;background:#fff;color:var(--ui);font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
.sw{display:flex;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.25)}
.sw i{display:block;width:22px;height:22px}
.pickers{display:grid;gap:10px}
.pick{display:flex;align-items:center;gap:12px;font-weight:600;font-size:.95rem}
.pick input{width:56px;height:44px;padding:2px;border:1.5px solid var(--ui);border-radius:8px;background:#fff;flex:none}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cv{display:grid;gap:6px;justify-items:start}
.cv img,.pimg img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;display:block}
.pimg{display:grid;gap:8px;max-width:320px}
input[type=range]{width:100%;accent-color:var(--ui)}
.dtabs{display:flex;gap:6px;overflow:auto;margin:0 -4px 14px;padding:0 4px 6px}
.dtab{flex:none;padding:8px 16px;border:2px solid var(--ui);border-radius:999px;background:#fff;color:var(--ui);font-weight:600;font-size:.9rem;cursor:pointer;font-family:inherit}
.dtab[aria-pressed="true"]{background:var(--ui);color:var(--ui-fg)}
.grid3{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:6px;margin:0 0 14px}
.grid3 button{border:2px solid var(--ui);border-radius:8px;background:#fff;cursor:pointer;padding:0}
.grid3 button[aria-pressed="true"]{background:var(--ui)}
.rowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid rgba(0,0,0,.12)}
.rowline:first-of-type{border-top:0}
.rowline .grow{flex:1;min-width:120px;font-weight:600}
.rowline input[type=text]{padding:8px 10px;border:1.5px solid var(--ui);border-radius:8px;font:inherit;font-size:.95rem;min-width:0;flex:1}
.mini{min-width:36px;min-height:36px;padding:0 10px;border:1.5px solid var(--ui);border-radius:8px;background:#fff;color:var(--ui);font-weight:700;cursor:pointer;font-family:inherit}
.mini[aria-pressed="true"]{background:var(--ui);color:var(--ui-fg)}
.mini.sw-b[aria-pressed="true"]{outline:3px solid #b3261e;outline-offset:2px}
.mini.del{border-color:#b3261e;color:#b3261e}
.opt{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-weight:600}
.opt input{width:22px;height:22px}
.lang-tabs{display:flex;gap:6px;margin:0 0 10px}

dialog.reader{width:100%;max-width:none;height:100%;max-height:none;margin:0;background:var(--bg3);color:var(--fg3);overflow:auto}
.rd{max-width:760px;margin:0 auto;padding:80px var(--pad) 64px}
.rd img{display:block;width:100%;height:auto;max-height:60dvh;object-fit:cover;margin:0 0 24px;border-radius:var(--r)}
.rd.people img{max-width:360px;margin-inline:auto;filter:grayscale(1)}
.rd h2{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6vw,4.5rem);line-height:1.15;margin:12px 0 24px}
html[lang="en"] .rd h2{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(2rem,5vw,3.8rem)}
.rd.people{text-align:center}
.rd-body p{margin:0 0 1.2em;font-size:1.15em;line-height:1.9}
.rd .lifeline{font-size:1.1em;font-weight:600;margin:-8px 0 18px}
.x{position:fixed;z-index:5;top:14px;inset-inline-start:14px;width:46px;height:46px;border:0;border-radius:50%;background:var(--fg3);color:var(--bg3);font-size:1.7rem;line-height:1;cursor:pointer}
dialog.viewer{width:100%;max-width:none;height:100%;max-height:none;margin:0;background:#000;color:#fff}
dialog.viewer[open]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 12px 96px}
.viewer img,.viewer video{max-width:100%;max-height:100%;min-height:0;object-fit:contain}
.viewer iframe{width:min(1000px,100%);aspect-ratio:16/9;border:0;background:#000}
.viewer p{margin:0;text-align:center}
.viewer .x{background:#fff;color:#000}
.vnav{position:fixed;inset-inline:0;bottom:14px;display:flex;justify-content:center;gap:16px}
.vnav button{width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:#000;font-size:1.8rem;line-height:1;cursor:pointer}

/* timeline */
.timeline{--tl-w:clamp(84px,17vw,128px);list-style:none;margin:0;padding:0;position:relative;display:grid;gap:clamp(20px,3vw,36px)}
.timeline::before{content:"";position:absolute;inset-block:10px;inset-inline-start:calc(var(--tl-w) / 2);margin-inline-start:-1.5px;width:3px;background:currentColor;opacity:.35}
.tl-item{position:relative;display:grid;grid-template-columns:var(--tl-w) minmax(0,1fr);gap:clamp(12px,2vw,24px);align-items:start}
.tl-year{position:relative;z-index:1;justify-self:center;text-align:center;padding:4px 12px;border-radius:999px;background:var(--sfg);color:var(--sbg);font-family:var(--display);font-size:clamp(1.05rem,2.6vw,1.6rem);line-height:1.5}
html[lang="en"] .tl-year{font-family:var(--display-lat)}
.tl-card{border:2px solid currentColor;border-radius:var(--r);padding:clamp(14px,2vw,22px);display:grid;gap:10px;background:var(--sbg)}
.tl-img{width:100%;max-height:300px;object-fit:cover;border-radius:calc(var(--r) - 4px);display:block}
.tl-title{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,3vw,2.2rem);line-height:1.25;margin:0}
html[lang="en"] .tl-title{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.2rem,2.6vw,1.9rem)}
.tl-text{margin:0;opacity:.9}
/* directory */
.dir-list{display:grid;gap:clamp(12px,2vw,20px)}
@media (min-width:800px){.dir-list{grid-template-columns:1fr 1fr}}
.dcard{display:flex;gap:16px;border:2px solid currentColor;border-radius:var(--r);padding:clamp(14px,2vw,22px)}
.dc-ic{flex:none;align-self:flex-start;display:grid;place-items:center;width:clamp(50px,8vw,64px);aspect-ratio:1;border-radius:50%;background:var(--sfg);color:var(--sbg);font-size:1.6rem}
.dc-body{min-width:0;flex:1}
.dc-name{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,3vw,2rem);line-height:1.25;margin:0}
html[lang="en"] .dc-name{font-family:var(--display-lat);text-transform:uppercase;font-size:clamp(1.2rem,2.6vw,1.7rem)}
.dc-cat{margin:2px 0 6px;font-size:.85rem;opacity:.7}
.dc-addr,.dc-note,.dc-phone{margin:0 0 6px}
.dc-note{opacity:.85;font-size:.95rem}
.dc-body .row-tools{padding:6px 0 0}
.dc-body .tool{text-decoration:none;display:inline-flex;align-items:center}

function tileLive(it){

  var s=site.sections.filter(function(x){return x.id===it.v})[0];

  if(it.v==='directory')return site.directory.length>0;

  if(it.v==='intro')return introIndex()>=0;

}

/* ---------- village history (timeline) ---------- */
function isTL(p){var c=catOf(p.cat);return!!c&&c.kind==='timeline'}
function yearLabel(p){return(p.extra&&p.extra.year)?String(p.extra.year):yearOf(p.date)}
function yearKey(p){
  var y=String((p.extra&&p.extra.year)||'').replace(/[٠-٩]/g,function(d){return'٠١٢٣٤٥٦٧٨٩'.indexOf(d)}),m=/(\d{3,4})/.exec(y);
  if(m)return+m[1];
  var y2=yearOf(p.date);return y2?+y2:99999;
}
function historyHTML(s){
  var list=shown().filter(isTL).sort(function(a,b){return yearKey(a)-yearKey(b)||((a.created||'')<(b.created||'')?-1:1)});
  if(!list.length&&!ui.edit)return'';
  var items=list.map(function(p){
    var img=safeUrl(p.image),ex=excerpt(p,240),id=esc(p.id);
    return'<li class="tl-item"><div class="tl-year">'+esc(dig(yearLabel(p)))+'</div><div class="tl-card">'+(img?'<img class="tl-img" alt="" loading="lazy" src="'+img+'">':'')+'<h3 class="tl-title">'+esc(pTitle(p))+'</h3>'+(ex?'<p class="tl-text">'+esc(ex)+'</p>':'')+'<div class="row-tools" style="padding:0"><button class="tool" data-act="post-open" data-id="'+id+'">'+t('hist_more')+'</button></div>'+ownerTools(p)+'</div></li>';
  }).join('');
  var tl=(site.cats.filter(function(c){return c.kind==='timeline'})[0]||{}).id||'history';
  return secOpen(s)+secTitle(s)+(list.length?'<ol class="timeline">'+items+'</ol>':'<p class="empty">'+t('hist_empty')+'</p>')+
    (ui.edit?'<button class="add-btn" data-act="post-add" data-cat="'+esc(tl)+'">＋ إضافة محطة</button>':(CONFIGURED?'<button class="add-btn" data-act="submit-open" data-cat="'+esc(tl)+'">'+t('hist_add')+'</button>':''))+'</section>';
}

/* ---------- village directory ---------- */
function telHref(p){var d=String(p||'').replace(/[^\d+]/g,'');return d.replace(/\D/g,'').length>=5?'tel:'+d:''}
function waHref(p){var s=String(p||'').trim();if(!/^(\+|00)/.test(s))return'';var d=s.replace(/\D/g,'').replace(/^00/,'');return d.length>=8?'https://wa.me/'+d:''}
function dirCat(id){return DIRCATS.filter(function(c){return c.id===id})[0]||DIRCATS[DIRCATS.length-1]}
function dirNorm(s){
  return String(s==null?'':s).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[٠-٩]/g,function(d){return'٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)});
}
function dirMatch(x,q){
  var toks=dirNorm(q).split(/\s+/).filter(Boolean);if(!toks.length)return true;
  var c=dirCat(x.cat),h=dirNorm([tx(x.name),tx(x.role),tx(x.addr),tx(x.note),c.ar,c.en,String(x.phone||'').replace(/\D/g,'')].join(' '));
  return toks.every(function(k){return h.indexOf(k)>=0});
}
function dirFilterNow(){
  var present=DIRCATS.filter(function(c){return site.directory.some(function(x){return x.cat===c.id})});
  return ui.dircat&&present.some(function(c){return c.id===ui.dircat})?ui.dircat:'all';
}
function dirCardsHTML(f,q){
  return site.directory.map(function(x,i){
    if(!ui.edit&&((f!=='all'&&x.cat!==f)||!dirMatch(x,q)))return'';
    var c=dirCat(x.cat),tel=telHref(x.phone),wa=waHref(x.phone);
    var sel='<select class="dir-catsel" data-dircat="'+i+'" aria-label="التصنيف">'+DIRCATS.map(function(k){return'<option value="'+k.id+'"'+(k.id===x.cat?' selected':'')+'>'+k.ic+' '+esc(k.ar)+'</option>'}).join('')+'</select>';
    return'<article class="dcard"><div class="dc-ic" aria-hidden="true">'+c.ic+'</div><div class="dc-body"><h3 class="dc-name"'+ea('directory.'+i+'.name','اسم المكان أو الشخص',1,1)+'>'+esc(tx(x.name))+'</h3>'+
      ((tx(x.role)||ui.edit)?'<p class="dc-role"'+ea('directory.'+i+'.role','المهنة أو التخصص (مثلاً: صيدلاني، كهربائي، مدير المدرسة)',1,1)+'>'+esc(tx(x.role))+'</p>':'')+'<p class="dc-cat">'+esc(c[lang])+'</p>'+
      ((tx(x.addr)||ui.edit)?'<p class="dc-addr"'+ea('directory.'+i+'.addr','العنوان أو وصف الموقع',1,1)+'>'+esc(tx(x.addr))+'</p>':'')+
      ((tx(x.note)||ui.edit)?'<p class="dc-note"'+ea('directory.'+i+'.note','ملاحظة (أوقات العمل...)',1,1)+'>'+esc(tx(x.note))+'</p>':'')+
      (ui.edit?'<p class="dc-phone" dir="ltr"'+ea('directory.'+i+'.phone','+963 ... (بصيغة دولية ليعمل واتساب)',1)+'>'+esc(x.phone)+'</p><div class="row-tools">'+sel+'<button class="tool" data-act="dir-up" data-i="'+i+'">↑</button><button class="tool" data-act="dir-down" data-i="'+i+'">↓</button><button class="tool danger" data-act="dir-del" data-i="'+i+'">حذف</button></div>'
        :((tel||wa)?'<div class="row-tools">'+(tel?'<a class="tool" href="'+esc(tel)+'">'+t('dir_call')+'</a>':'')+(wa?'<a class="tool" target="_blank" rel="noopener" href="'+esc(wa)+'">'+t('dir_wa')+'</a>':'')+'</div>':''))+'</div></article>';
  }).join('');
}
function dirListInner(f,q){var h=dirCardsHTML(f,q);return h||(ui.edit?'':'<p class="empty">'+t('dir_noresult')+'</p>')}
function pendingSuggestions(){return(ui.admin&&ui.edit)?suggestions:[]}
function pendSuggestHTML(){

  h.style.fontSize='100px';
  var one=isV2()&&window.innerWidth>=700,wmax=0;
  spans.forEach(function(s){var w=s.getBoundingClientRect().width;wmax=one?wmax+w+28:Math.max(wmax,w)});

  var lh=lang==='ar'?.95:.98,vh=window.innerHeight,frac=site.design.heroSize==='half'?.34:site.design.heroSize==='tall'?.42:.46;
  var byW=100*avail*.98/wmax,byH=vh*frac/((one?1:spans.length)*lh);

/* ---------- map (small built-in engine: no external library) ---------- */
var LAYERS={
  osm:{max:17,url:function(z,x,y){return'https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png'},
    attr:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'},
  sat:{max:16,url:function(z,x,y){return'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+y+'/'+x},
    attr:'Esri, Maxar, Earthstar Geographics'}
};
var MINZ=6;
function wpx(lng,z){return(lng+180)/360*256*Math.pow(2,z)}
function wpy(lat,z){var s=Math.sin(lat*Math.PI/180);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*Math.pow(2,z)}
function unx(x,z){return x/(256*Math.pow(2,z))*360-180}
function uny(y,z){var n=Math.PI-2*Math.PI*y/(256*Math.pow(2,z));return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)))}
var mm=null,mmIO=null,mmRO=null,mmRaf=0,mmHintT=0,mmFly=0;

function mapDestroy(){
  if(mmIO){mmIO.disconnect();mmIO=null}
  if(mmRO){mmRO.disconnect();mmRO=null}
  if(mmRaf){cancelAnimationFrame(mmRaf);mmRaf=0}
  if(mmFly){cancelAnimationFrame(mmFly);mmFly=0}
  mm=null;
}
function setupMap(){
  mapDestroy();
  var box=$('mapbox');if(!box)return;
  if('IntersectionObserver' in window){
    mmIO=new IntersectionObserver(function(es){if(es[0].isIntersecting){mmIO.disconnect();mmIO=null;mapInit(box)}},{rootMargin:'400px'});
    mmIO.observe(box);
  }else mapInit(box);
}
function mmHint(msg){
  if(!mm)return;
  var h=mm.hint;h.textContent=msg;h.classList.add('show');
  clearTimeout(mmHintT);mmHintT=setTimeout(function(){h.classList.remove('show')},2200);
}
function mapInit(box){
  var c=mapCfg(),layer=site.map.layer==='sat'?'sat':'osm';
  mm={box:box,z:Math.min(c.zoom,LAYERS[layer].max),lat:c.lat,lng:c.lng,pin:{lat:c.lat,lng:c.lng},layer:layer,tiles:{},poi:{},ok:0,err:0,moved:false};
  var brand=lang==='ar'?site.brand.ar:site.brand.en;
  box.innerHTML='<div class="mm-tiles"></div><div class="mm-vig"></div>'+
    '<div class="mm-pin"><span class="pin-ring"></span><span class="pin-dot">'+STAR0+'</span><span class="pin-label">'+esc(brand)+'</span></div>'+
    '<div class="mm-ctl"><button type="button" data-mm="in" aria-label="'+t('zoom_in')+'">+</button><button type="button" data-mm="out" aria-label="'+t('zoom_out')+'">−</button><button type="button" data-mm="home" aria-label="'+t('recenter')+'">◎</button></div>'+
    '<div class="mm-hint" role="status"></div><div class="mm-attr"></div>';
  mm.layerEl=box.querySelector('.mm-tiles');mm.pinEl=box.querySelector('.mm-pin');mm.hint=box.querySelector('.mm-hint');mm.attrEl=box.querySelector('.mm-attr');
  mm.attrEl.innerHTML=LAYERS[layer].attr;
  (site.map.pois||[]).forEach(function(p){
    if(!(p.lat>=-85&&p.lat<=85&&p.lng>=-180&&p.lng<=180))return;
    var el=document.createElement('div');el.className='mm-poi';el.dataset.id=p.id;
    el.innerHTML='<button type="button" class="poi-b" aria-label="'+esc(tx(p.name))+'">'+esc(p.icon||'📍')+'</button><span class="poi-l">'+esc(tx(p.name))+'</span>';
    box.appendChild(el);mm.poi[p.id]={el:el,lat:p.lat,lng:p.lng};
  });
  bindMap(box);
  if('ResizeObserver' in window){mmRO=new ResizeObserver(mmQueue);mmRO.observe(box)}
  mmRender();
  setTimeout(function(){
    if(mm&&mm.box===box&&mm.ok===0&&mm.err>0&&!$('mapnote')){
      var n=document.createElement('div');n.id='mapnote';n.className='map-note';n.textContent=t('map_fail');
      $('mapwrap').appendChild(n);
    }
  },7000);
}
function mmQueue(){if(!mmRaf){mmRaf=requestAnimationFrame(function(){mmRaf=0;mmRender()})}}
function mmRender(){
  if(!mm)return;
  var b=mm.box,w=b.clientWidth,h=b.clientHeight;if(!w||!h)return;
  var z=mm.z,n=Math.pow(2,z),cx=wpx(mm.lng,z),cy=wpy(mm.lat,z),ox=cx-w/2,oy=cy-h/2;
  var x0=Math.floor(ox/256)-1,x1=Math.floor((ox+w)/256)+1,y0=Math.floor(oy/256)-1,y1=Math.floor((oy+h)/256)+1;
  var need={},L=LAYERS[mm.layer];
  for(var ty=y0;ty<=y1;ty++){
    if(ty<0||ty>=n)continue;
    for(var tx0=x0;tx0<=x1;tx0++){
      var wx=((tx0%n)+n)%n,key=mm.layer+'/'+z+'/'+tx0+'/'+ty;
      need[key]=1;
      var img=mm.tiles[key];
      if(!img){
        img=new Image();img.className='mm-tile';img.alt='';img.draggable=false;
        img.onload=function(){this.classList.add('in');if(mm)mm.ok++};
        img.onerror=function(){if(mm)mm.err++};
        img.src=L.url(z,wx,ty);
        mm.tiles[key]=img;mm.layerEl.appendChild(img);
      }
      img.style.transform='translate('+Math.round(tx0*256-ox)+'px,'+Math.round(ty*256-oy)+'px)';
    }
  }
  Object.keys(mm.tiles).forEach(function(k){if(!need[k]){mm.tiles[k].remove();delete mm.tiles[k]}});
  mm.pinEl.style.transform='translate('+Math.round(wpx(mm.pin.lng,z)-ox)+'px,'+Math.round(wpy(mm.pin.lat,z)-oy)+'px)';
  Object.keys(mm.poi).forEach(function(id){
    var p=mm.poi[id];p.el.style.transform='translate('+Math.round(wpx(p.lng,z)-ox)+'px,'+Math.round(wpy(p.lat,z)-oy)+'px)';
  });
  b.classList.toggle('mm-z',z>=14);
}
function mmPanBy(dx,dy){
  var z=mm.z;
  mm.lng=unx(wpx(mm.lng,z)-dx,z);
  mm.lat=Math.max(-84,Math.min(84,uny(wpy(mm.lat,z)-dy,z)));
  mmQueue();
}
function mmZoomTo(nz,ax,ay){
  nz=Math.max(MINZ,Math.min(LAYERS[mm.layer].max,Math.round(nz)));
  if(nz===mm.z)return;
  var b=mm.box,w=b.clientWidth,h=b.clientHeight,z=mm.z;
  if(ax==null){ax=w/2;ay=h/2}
  var alng=unx(wpx(mm.lng,z)+(ax-w/2),z),alat=uny(wpy(mm.lat,z)+(ay-h/2),z);
  mm.z=nz;
  mm.lng=unx(wpx(alng,nz)-(ax-w/2),nz);
  mm.lat=Math.max(-84,Math.min(84,uny(wpy(alat,nz)-(ay-h/2),nz)));
  mmQueue();
}
function mmFlyTo(lat,lng,z){
  if(!mm)return;
  if(z&&z!==mm.z){mm.z=Math.max(MINZ,Math.min(LAYERS[mm.layer].max,z))}
  if(reduce){mm.lat=lat;mm.lng=lng;mmRender();return}
  var z0=mm.z,x0=wpx(mm.lng,z0),y0=wpy(mm.lat,z0),x1=wpx(lng,z0),y1=wpy(lat,z0),t0=performance.now(),dur=650;
  if(mmFly)cancelAnimationFrame(mmFly);
  (function step(now){
    var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    if(!mm)return;

var q={timers:0,inflight:0,error:false},timers={};
function statusText(){return q.inflight?'جاري الحفظ...':q.timers?'تغييرات قيد الحفظ...':q.error?'تعذّر الحفظ، تأكد من الاتصال':'تم الحفظ'}
function updateBar(){
  var s=$('status');if(!s)return;
  s.textContent=statusText();
  $('bar').classList.toggle('warn',!!(q.inflight||q.timers||q.error));
  var n=pendingPosts().length+pendingReviews().length+pendingPhotos().length+pendingComments().length+pendingSuggestions().length+pendingAds().length+(ui.admin&&ui.edit?unreadMessages():0);
  $('revbtn').textContent=n?'مراجعة ('+nf(n)+')':'مراجعة';
}
async function run(fn){
  q.inflight++;updateBar();
  var ok=false;
  try{ok=await fn()}catch(e){ok=false}
  q.inflight--;q.error=!ok;
  if(!ok)toast('تعذّر الحفظ. تأكد من الاتصال ثم جرّب مرة ثانية.');
  updateBar();
  return ok;
}
function debounce(key,fn,ms){
  if(timers[key]){clearTimeout(timers[key].t)}else{q.timers++}
  timers[key]={fn:fn,t:setTimeout(function(){delete timers[key];q.timers--;run(fn)},ms)};
  updateBar();
}
function flush(){
  Object.keys(timers).forEach(function(k){var x=timers[k];clearTimeout(x.t);delete timers[k];q.timers--;run(x.fn)});
}

/* ---------- images, videos, uploads ---------- */
function readImage(file,maxSide,quality,png){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('decode'))};
      im.onload=function(){
        var s=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
        var w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');
        if(!png){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
        x.drawImage(im,0,0,w,h);
        c.toBlob(function(b){b?res(b):rej(new Error('blob'))},png?'image/png':'image/jpeg',quality);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function upload(blob,folder,ext,ctype){
  var path=folder+'/'+uid()+'.'+(ext||'jpg');
  var r=await sb.storage.from('media').upload(path,blob,{contentType:ctype||'image/jpeg',upsert:false});
  if(r.error)return null;
  var u=sb.storage.from('media').getPublicUrl(path);
  return{path:path,url:u.data.publicUrl};
}

function videoPoster(file){
  return new Promise(function(res){
    var v=document.createElement('video'),url=URL.createObjectURL(file),done=false,tm=0,seeked=false;
    v.muted=true;v.defaultMuted=true;v.playsInline=true;v.preload='auto';
    v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
    v.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
    document.body.appendChild(v);
    function fin(b){
      if(done)return;done=true;clearTimeout(tm);
      try{v.pause();v.removeAttribute('src');v.load()}catch(e){}
      try{v.remove()}catch(e){}
      try{URL.revokeObjectURL(url)}catch(e){}
      res(b||null);
    }
    function draw(){
      try{
        var w=v.videoWidth,h=v.videoHeight;if(!w||!h)return false;
        var s=Math.min(1,900/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        c.toBlob(function(b){fin(b)},'image/jpeg',.8);return true;
      }catch(e){return false}
    }
    function seek(){try{var d=isFinite(v.duration)&&v.duration>0?v.duration:2;v.currentTime=Math.min(1,d/3)}catch(e){}}
    v.addEventListener('loadedmetadata',seek);
    v.addEventListener('loadeddata',seek);
    v.addEventListener('seeked',function(){seeked=true;if(!draw())setTimeout(draw,250)});
    v.addEventListener('error',function(){fin(null)});
    tm=setTimeout(function(){fin(null)},12000);
    v.src=url;
    /* iPhone Safari often decodes a frame only after a short muted play */
    var pr;try{pr=v.play()}catch(e){}
    if(pr&&pr.then)pr.then(function(){setTimeout(function(){if(!done&&!seeked){try{v.pause()}catch(e){}seek()}},500)},function(){});
  });
}

}

      document.head.appendChild(sc);

  });

/* ---------- visit counter: anonymous (no name, no IP, no cookies) ---------- */
var VSRC=['direct','whatsapp','facebook','google','telegram','instagram','x','youtube','other'];
function anonId(){
  var v=ls('malha-vid');
  if(!/^[a-z0-9]{8,40}$/.test(v||'')){
    v=(Date.now().toString(36)+Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,8)).replace(/[^a-z0-9]/g,'').slice(0,28);
    ls('malha-vid',v);
  }
  return v;
}
function visitSource(){
  var q=/[?&]from=([a-z]{1,12})(?:&|#|$)/.exec(location.search);
  if(q&&VSRC.indexOf(q[1])>=0)return q[1];
  var ref=document.referrer||'';
  if(!ref)return'direct';
  var h='';
  try{h=new URL(ref).hostname.toLowerCase()}catch(e){return'other'}
  if(h===location.hostname)return'direct';
  if(/(^|\.)wa\.me$|whatsapp/.test(h))return'whatsapp';
  if(/facebook\.com$|fb\.com$|fb\.me$/.test(h))return'facebook';
  if(/(^|\.)google\./.test(h))return'google';
  if(/(^|\.)t\.me$|telegram/.test(h))return'telegram';
  if(/instagram\.com$/.test(h))return'instagram';
  if(/(^|\.)(twitter|x)\.com$|(^|\.)t\.co$/.test(h))return'x';
  if(/youtube\.com$|youtu\.be$/.test(h))return'youtube';
  return'other';
}
async function recordVisit(){
  if(!sb||ui.admin||ls('malha-nocount')==='1')return;
  if(/bot|crawl|spider|slurp|preview/i.test(navigator.userAgent||''))return;
  var day=todayISO();
  if(ls('malha-vday')===day)return;
  var r=await withTimeout(sb.rpc('record_visit',{p_vid:anonId(),p_lang:lang,p_device:/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent||'')?'mobile':'desktop',p_src:visitSource()}),5000,{error:true});
  if(r&&!r.error)ls('malha-vday',day);
}


/* ---------- audio files ---------- */
async function addAudio(file){
  var ext=(/\.([a-z0-9]{2,4})$/i.exec(file.name||'')||[])[1]||'';ext=ext.toLowerCase();
  var map={m4a:'audio/mp4',mp4:'audio/mp4',mp3:'audio/mpeg',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',webm:'audio/webm'};
  var ctype=map[ext]||(/^audio\//.test(file.type)?file.type.split(';')[0]:'');
  if(!ctype){toast('نوع الملف غير مدعوم. استعمل m4a أو mp3 أو wav.');return}
  if(!ext)ext=ctype==='audio/mpeg'?'mp3':ctype==='audio/wav'?'wav':ctype==='audio/webm'?'webm':ctype==='audio/ogg'?'ogg':'m4a';
  if(file.size>50*1024*1024){toast('حجم الملف أكبر من 50 ميغابايت.');return}
  toast('جاري رفع التسجيل...');
  var up=await upload(file,'audio',ext,ctype);
  if(!up){toast('تعذّر رفع الملف. تأكد من الاتصال وأن update4.sql تم تشغيله.');return}
  var r=await sb.from('photos').insert({url:up.url,kind:'audio',caption:'',caption_en:'',speaker:'',sort:nextSort()}).select().single();
  if(r.error||!r.data){removeFiles([up.url]);toast('تعذّر حفظ التسجيل. تأكد من تشغيل update4.sql.');return}
  photos.push(photoFromRow(r.data));renderAll();
  toast('تمت الإضافة. اكتب عنوان التسجيل واسم المتحدث مباشرة من القسم.');
}

async function savePost(approveToo){
  var d=$('editor'),tAr=$('p-title').value.trim(),tEn=$('p-title-en').value.trim();
  if(!tAr&&!tEn){toast('اكتب العنوان أولاً');$('p-title').focus();return}
  edPost.cat=$('p-cat').value;
  edPost.title={ar:tAr,en:tEn};edPost.body={ar:$('p-body').value,en:$('p-body-en').value};
  edPost.author=$('p-author').value.trim();
  var kind=kindOf(edPost.cat);
  edPost.date=$('p-date').value;
  edPost.time=kind==='event'?$('p-time').value:'';
  edPost.place=(kind==='event'||kind==='people')?$('p-place').value.trim():'';
  edPost.extra=edPost.extra||{};
  if(kind==='people')edPost.extra.born=$('p-born').value.trim();else delete edPost.extra.born;
  if(kind==='timeline'){
    var yr=$('p-year').value.trim();
    if(!yr){toast('اكتب السنة أو الفترة.');$('p-year').focus();return}
    edPost.extra.year=yr;edPost.date=/^\d{4}$/.test(yr)?yr+'-01-01':'';edPost.time='';edPost.place='';
  }else delete edPost.extra.year;
  edPost.pinned=$('p-pin').checked;
  edPost.status=$('p-status').value;
  if(approveToo)edPost.status='approved';
  var old=posts.filter(function(x){return x.id===edPost.id})[0],oldImage=old?old.image:'';
  toast('جاري الحفظ...');
  if(edPost._blob){
    var up=await upload(edPost._blob,'posts');
    if(!up){toast('تعذّر رفع الصورة. جرّب مرة ثانية.');return}
    edPost.image=up.url;
  }
  var row=toRow(edPost),res;
  if(edPost._new)res=await sb.from('posts').insert(row).select().single();
  else res=await sb.from('posts').update(row).eq('id',edPost.id).select().single();
  if(res.error||!res.data){toast('تعذّر الحفظ. تأكد من الاتصال، وأن تحديث قاعدة البيانات (update.sql) تم تشغيله.');return}
  var saved=fromRow(res.data);
  if(edPost._new)posts.push(saved);else posts=posts.map(function(x){return x.id===saved.id?saved:x});
  if(oldImage&&oldImage!==saved.image)removeFiles([oldImage]);
  edPost=null;$('editor').close();renderAll();
  toast(saved.status==='approved'?'تم النشر.':'تم الحفظ.');
}
async function patchPost(id,patch,okMsg){

  posts=posts.map(function(x){return x.id===id?fromRow(r.data):x});
  renderAll();if(okMsg)toast(okMsg);return true;
}

async function doLogin(){

    var em=String(r.error.message||''),why;
    if(/invalid login credentials/i.test(em))why='البريد أو كلمة السر غير صحيحة.';
    else if(/email not confirmed/i.test(em))why='الحساب غير مؤكد في Supabase. افتح الحساب هناك وفعّل التأكيد.';
    else if(/api key|apikey|jwt/i.test(em))why='مفتاح المشروع داخل الملف غير صحيح.';
    else if(/disabled|not allowed|provider/i.test(em))why='تسجيل الدخول بالبريد مغلق في إعدادات Supabase.';
    else if(/fetch|network|timeout|load failed/i.test(em)||!r.error.status)why='تعذّر الاتصال بـ Supabase. تأكد من الإنترنت ثم جرّب.';

  $('login').close();

/* ---------- password: change (inside the panel), forgot (login dialog), recovery (from the e-mail link) ---------- */
function pwProblem(n1,n2,cur){
  if(n1.length<10)return'كلمة السر الجديدة قصيرة: اكتب 10 خانات أو أكثر.';
  if(!/^[\x21-\x7e]+$/.test(n1))return'استعمل الكيبورد الإنجليزي فقط، بدون حروف عربية وبدون مسافات.';
  if(!/[A-Za-z]/.test(n1)||!/\d/.test(n1))return'استعمل أحرفاً إنجليزية وأرقاماً معاً.';
  if(n1!==n2)return'كلمتا السر الجديدتان غير متطابقتين.';
  if(cur!==undefined&&n1===cur)return'الكلمة الجديدة لازم تختلف عن الحالية.';
  return'';
}
function pwUpdateError(e){
  var m=String(e&&e.message||'');
  if(/same|different/i.test(m))return'الكلمة الجديدة لازم تختلف عن الحالية.';
  if(/weak|at least|short|characters/i.test(m))return'كلمة السر ضعيفة أو قصيرة. اختر كلمة أطول.';
  if(/fetch|network|timeout/i.test(m))return'تعذّر الاتصال. تأكد من الإنترنت ثم جرّب.';
  return'تعذّر تغيير كلمة السر. ['+m.slice(0,80)+']';
}
async function changePassword(){
  var cur=$('pw-cur').value,n1=$('pw-new').value,n2=$('pw-new2').value,err=$('pw-err'),btn=$('pw-go');
  function bad(m){err.textContent=m;err.hidden=false}
  err.hidden=true;
  if(!cur){bad('اكتب كلمة السر الحالية.');return}
  var pr=pwProblem(n1,n2,cur);if(pr){bad(pr);return}
  btn.disabled=true;btn.textContent='جاري التغيير...';
  try{
    var u=await sb.auth.getUser(),email=u&&u.data&&u.data.user&&u.data.user.email;
    if(!email){bad('تعذّر معرفة حسابك. سجّل خروج ثم دخول وجرّب.');return}
    var a=await sb.auth.signInWithPassword({email:email,password:cur});
    if(a.error){bad(/invalid login/i.test(String(a.error.message))?'كلمة السر الحالية غير صحيحة.':pwUpdateError(a.error));return}
    var r=await sb.auth.updateUser({password:n1});
    if(r.error){bad(pwUpdateError(r.error));return}
    try{await sb.auth.signOut({scope:'others'})}catch(e){}
    ['pw-cur','pw-new','pw-new2'].forEach(function(id){var i=$(id);if(i)i.value=''});
    toast('تم تغيير كلمة السر، وسُجِّل خروجك من أي جهاز آخر.');
  }catch(e){bad(pwUpdateError(e))}
  finally{btn.disabled=false;btn.textContent='تغيير كلمة السر'}
}

function contactLink(c){
  c=String(c||'').trim();if(!c)return'';
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c))return'<a class="tool" href="mailto:'+esc(c)+'">'+esc(c)+'</a>';
  var d=c.replace(/[^\d+]/g,''),digits=d.replace(/\D/g,'');

/* ---------- recording a voice from the site (owner) ---------- */
var rec={stream:null,mr:null,chunks:[],t0:0,timer:0,blob:null,mime:'',ext:'m4a',url:''};
function recMime(){
  var c=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  if(!window.MediaRecorder)return'';
  for(var i=0;i<c.length;i++){try{if(MediaRecorder.isTypeSupported(c[i]))return c[i]}catch(e){}}
  return'';
}
function recCleanup(){
  clearInterval(rec.timer);
  try{if(rec.mr&&rec.mr.state!=='inactive'){rec.mr.onstop=null;rec.mr.stop()}}catch(e){}
  try{if(rec.stream)rec.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}
  if(rec.url){try{URL.revokeObjectURL(rec.url)}catch(e){}}
  rec={stream:null,mr:null,chunks:[],t0:0,timer:0,blob:null,mime:'',ext:'m4a',url:''};
}
function recHTML(state){
  if(state==='idle')return'<div class="dlg-in"><h3>🎙 تسجيل صوتي</h3><p class="hint">اضغط «ابدأ»، وسيطلب المتصفح إذنك باستعمال الميكروفون. تكلّم بقرب من الهاتف وفي مكان هادئ. أفضل نتيجة على الآيفون.</p><div class="ed-actions"><button class="primary" data-act="rec-start">● ابدأ التسجيل</button><button data-close>إلغاء</button></div></div>';
  if(state==='rec')return'<div class="dlg-in"><h3>🔴 جاري التسجيل...</h3><p id="rec-time" style="font-size:2.4rem;font-weight:700;margin:6px 0 16px;direction:ltr;text-align:center">00:00</p><div class="ed-actions"><button class="primary" data-act="rec-stop">■ إيقاف</button></div></div>';
  return'<div class="dlg-in"><h3>تسجيلك</h3><audio controls src="'+esc(rec.url)+'" style="width:100%;margin:0 0 14px"></audio>'+
    '<label class="fld">عنوان التسجيل<input id="rec-title" maxlength="200" placeholder="مثال: حكاية أول موسم حصاد"></label>'+
    '<label class="fld">اسم المتحدث (اختياري)<input id="rec-speaker" maxlength="120"></label><p class="err" id="rec-err" hidden></p>'+
    '<div class="ed-actions"><button class="primary" data-act="rec-save" id="rec-go">حفظ</button><button data-act="rec-again">إعادة التسجيل</button></div></div>';
}
function openRecorder(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){toast('هذا المتصفح لا يدعم التسجيل هنا. ارفع ملفاً صوتياً بدلاً من ذلك.');return}
  recCleanup();var d=$('recdlg');d.innerHTML=recHTML('idle');openDlg(d);
}
async function recStart(){
  try{rec.stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){toast('ما قدرنا نوصل للميكروفون. اسمح للموقع باستعمال الميكروفون ثم جرّب.');return}
  rec.mime=recMime();
  try{rec.mr=new MediaRecorder(rec.stream,rec.mime?{mimeType:rec.mime}:{})}
  catch(e){toast('تعذّر بدء التسجيل على هذا المتصفح.');recCleanup();return}
  rec.chunks=[];
  rec.mr.ondataavailable=function(e){if(e.data&&e.data.size)rec.chunks.push(e.data)};
  rec.mr.onstop=function(){
    clearInterval(rec.timer);
    var type=(rec.mr&&rec.mr.mimeType)||rec.mime||'audio/webm';
    rec.blob=new Blob(rec.chunks,{type:type});
    rec.ext=/mp4|aac/.test(type)?'m4a':/ogg/.test(type)?'ogg':'webm';
    rec.url=URL.createObjectURL(rec.blob);
    try{rec.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}
    var d=$('recdlg');if(d&&d.open)d.innerHTML=recHTML('done');
  };
  rec.mr.start();rec.t0=Date.now();$('recdlg').innerHTML=recHTML('rec');
  rec.timer=setInterval(function(){
    var s=Math.floor((Date.now()-rec.t0)/1000),el=$('rec-time');
    if(el)el.textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2);
    if(s>=3000)recStop();
  },400);
}
function recStop(){try{rec.mr.stop()}catch(e){}}
async function recSave(){
  if(!rec.blob)return;
  var btn=$('rec-go'),err=$('rec-err');
  function bad(m){err.textContent=m;err.hidden=false;btn.disabled=false;btn.textContent='حفظ'}
  if(rec.blob.size>50*1024*1024){bad('التسجيل أكبر من 50 ميغابايت.');return}
  btn.disabled=true;btn.textContent='جاري الحفظ...';err.hidden=true;
  var base=(rec.blob.type||'audio/webm').split(';')[0];
  var up=await upload(rec.blob,'audio',rec.ext,base);
  if(!up){bad('تعذّر رفع التسجيل. تأكد من الاتصال وأن update4.sql تم تشغيله.');return}
  var r=await sb.from('photos').insert({url:up.url,kind:'audio',caption:($('rec-title').value||'').trim().slice(0,300),caption_en:'',speaker:($('rec-speaker').value||'').trim().slice(0,120),sort:nextSort()}).select().single();
  if(r.error||!r.data){removeFiles([up.url]);bad('تعذّر حفظ التسجيل. تأكد من تشغيل update4.sql.');return}
  photos.push(photoFromRow(r.data));$('recdlg').close();renderAll();toast('تم حفظ التسجيل.');
}

    case'ad-remove':adManage('remove');break;
    case'ad-report':adReport(id);break;
    case'ad-ok':adApprove(id);break;
    case'ad-clear':adClear(id);break;
    case'ad-del':if(confirmTap('ad'+id))adDelete(id);break;
    case'sug-open':openSuggest();break;
    case'sug-send':sendSuggest();break;
    case'sug-ok':sugAccept(id);break;
    case'sug-del':if(confirmTap('sd'+id))sugDelete(id);break;
    case'cmt-open':openComments(a.dataset.t,id);break;
    case'cmt-send':sendComment();break;
    case'cmt-ok':cmtApprove(id);break;
    case'cmt-del':if(confirmTap('cc'+id))cmtDelete(id);break;
    case'mod-add':addMod();break;
    case'mod-del':if(confirmTap('md'+id))delMod(id);break;
    case'blk-add':{var bid=uid();site.blocks.push({id:bid,title:{ar:'قسم جديد',en:'New section'},body:{ar:'',en:''},image:''});
      var at=site.sections.map(function(s){return s.id}).indexOf('contact');if(at<0)at=site.sections.length;
      site.sections.splice(at,0,{id:'blk_'+bid,on:true,bg:2});queueSettings();renderAll();refreshDesign();toast('تمت إضافة القسم. عدّل نصه مباشرة من الصفحة.');break}
    case'blk-del':if(confirmTap('bd'+i)){var bb=site.blocks.splice(i,1)[0];if(bb){if(bb.image)removeFiles([bb.image]);site.sections=site.sections.filter(function(s){return s.id!=='blk_'+bb.id})}queueSettings();renderAll();refreshDesign()}break;
    case'blk-img':ui.fileIdx=i;pickFiles('blk','image/*',false);break;
    case'blk-img-del':if(site.blocks[i]&&site.blocks[i].image){removeFiles([site.blocks[i].image]);site.blocks[i].image='';queueSettings();renderAll()}break;
    case'cat-up':if(moveIn(site.cats,i,-1)){queueSettings();renderAll();refreshDesign()}break;
    case'cat-down':if(moveIn(site.cats,i,1)){queueSettings();renderAll();refreshDesign()}break;
    case'cat-kind':site.cats[i].kind=a.dataset.k;queueSettings();renderAll();refreshDesign();break;
    case'cat-submit':site.cats[i].submit=!site.cats[i].submit;queueSettings();refreshDesign();break;
    case'cat-add':site.cats.push({id:'c'+uid().slice(-6),name:{ar:'تصنيف جديد',en:'New category'},one:{ar:'عنصر',en:'Item'},kind:'list',submit:true});queueSettings();renderAll();refreshDesign();break;
    case'cat-del':if(confirmTap('cd'+i,'اضغط حذف مرة ثانية. المواد داخل التصنيف لن تُحذف لكنها ستظهر تحت «الكل» فقط.')){site.cats.splice(i,1);if(!site.cats.length)site.cats=defaults().cats;queueSettings();renderAll();refreshDesign()}break;
    case'design-reset':if(confirmTap('dr','اضغط مرة ثانية لاستعادة التصميم الافتراضي (المحتوى لن يُحذف).')){var dd=defaults();site.theme=dd.theme;site.design=dd.design;site.cover.dark=40;queueSettings();renderAll();refreshDesign();toast('تمت استعادة التصميم.')}break;
    case'submit-open':openSubmit(a.dataset.cat);break;
    case'submit-img':pickFiles('submit','image/*',false);break;
    case'submit-send':sendSubmission();break;
    case'post-add':$('reader').close();openEditor(null,a.dataset.cat);break;
    case'post-edit':$('reader').close();openEditor(id);break;
    case'post-approve':$('reader').close();approvePost(id);break;
    case'post-del':if(confirmTap('p'+id,'اضغط حذف مرة ثانية للتأكيد')){$('reader').close();deletePost(id)}break;
    case'post-pin':{var pp2=posts.filter(function(x){return x.id===id})[0];if(pp2)patchPost(id,{pinned:!pp2.pinned},pp2.pinned?'أُلغي التثبيت.':'تم التثبيت في بداية الموقع.')}break;
    case'post-hide':{var ph=posts.filter(function(x){return x.id===id})[0];if(ph)patchPost(id,{status:ph.status==='draft'?'approved':'draft'},ph.status==='draft'?'تم النشر.':'أُخفيت (مسودة).')}break;
    case'post-img':pickFiles('post','image/*',false);break;
    case'post-img-del':edPost._blob=null;edPost.image='';refreshEditorImg();break;
    case'post-save':savePost(false);break;
    case'post-save-approve':savePost(true);break;
    case'photo-add':pickFiles('photos','image/*',true);break;
    case'vid-add':pickFiles('video','video/mp4,video/webm,video/quicktime',false);break;
    case'yt-add':openYt();break;
    case'yt-save':addYouTube($('yt-in').value).then(function(ok){if(ok)$('ytdlg').close()});break;
    case'photo-intro':{var pi=photos[i];if(pi){site.intro=site.intro||{};site.intro.id=(site.intro.id===pi.id)?'':pi.id;queueSettings();renderAll();toast(site.intro.id?'صار هذا فيديو التعريف، ويظهر بأول الموقع.':'أُلغي فيديو التعريف.')}break}
    case'photo-poster':ui.fileIdx=i;pickFiles('poster','image/*',false);break;
    case'photo-up':movePhoto(i,-1);break;
    case'photo-down':movePhoto(i,1);break;
    case'photo-del':
      if(confirmTap('ph'+i)){
        var ph2=photos[i];
        sb.from('photos').delete().eq('id',ph2.id).select('id').then(function(r){
          if(r.error||!r.data||!r.data.length){toast('تعذّر حذف العنصر.');return}
          photos=photos.filter(function(x){return x.id!==ph2.id});removeFiles([ph2.url,ph2.poster].filter(Boolean));if(site.intro&&site.intro.id===ph2.id){site.intro.id='';queueSettings()}renderAll();
        });
      }
      break;
    case'fact-add':site.about.facts.push({k:{ar:'عنوان',en:'Title'},v:{ar:'قيمة',en:'Value'}});queueSettings();renderSec('about');break;
    case'fact-del':site.about.facts.splice(i,1);queueSettings();renderSec('about');break;
    case'qa-add':site.about.qa.push({q:{ar:'سؤال جديد؟',en:'New question?'},a:{ar:'',en:''}});queueSettings();renderSec('about');break;
    case'qa-del':if(confirmTap('qa'+i)){site.about.qa.splice(i,1);queueSettings();renderSec('about')}break;
    case'link-add':site.contact.links.push({k:{ar:'رابط',en:'Link'},v:'',href:''});queueSettings();renderSec('contact');break;
    case'link-del':site.contact.links.splice(i,1);queueSettings();renderSec('contact');break;
    case'chip-add':site.map.chips.push({ar:'معلومة',en:'Info'});queueSettings();renderSec('map');break;
    case'chip-del':site.map.chips.splice(i,1);queueSettings();renderSec('map');break;
    case'poi-add':ui.poiMode=!ui.poiMode;renderSec('map');break;
    case'poi-del':if(confirmTap('pd'+id)){site.map.pois=site.map.pois.filter(function(x){return x.id!==id});queueSettings();renderSec('map')}break;
    case'poi-icon':{poiDraft.icon=a.dataset.ic;[].forEach.call(document.querySelectorAll('#poidlg [data-act="poi-icon"]'),function(b){b.setAttribute('aria-pressed',b===a?'true':'false')});break}
    case'poi-save':savePoi();break;
    case'rev-star':setRevStars(+a.dataset.n);break;
    case'rev-send':sendReview();break;
    case'rev-ok':approveReview(id);break;
    case'rev-del':if(confirmTap('rd'+id,'اضغط حذف مرة ثانية للتأكيد')){deleteReview(id)}break;
  }
});
document.addEventListener('input',function(e){
  var tg=e.target;
  if(tg.id==='q'){filterStories(tg.value);return}
  if(tg.id==='adq'){ui.adq=tg.value;var ag=$('ads-grid');if(ag)ag.innerHTML=adGridInner(adFilterNow(),ui.adq);return}
  if(tg.id==='dq'){ui.dq=tg.value;var dl=$('dir-list');if(dl)dl.innerHTML=dirListInner(dirFilterNow(),ui.dq);return}
  if(tg.dataset&&tg.dataset.color){site.theme[tg.dataset.color]=tg.value;applyDesign();queueSettings();return}
  if(tg.dataset&&tg.dataset.range){
    var pth=tg.dataset.range,v=+tg.value;
    if(pth==='cover.dark'){site.cover.dark=v;var h=document.querySelector('.hero');if(h)h.style.setProperty('--dark',v/100)}
    else{setPath(site,pth,v);applyDesign();if(pth==='design.tscale')fitHero()}
    var out=document.querySelector('[data-out="'+pth+'"]');if(out)out.textContent=v;
    queueSettings();return;
  }
  if(ui.edit&&tg.closest){var f=tg.closest('[data-path]');if(f)onEdit(f.dataset.path,f.textContent,f.hasAttribute('data-tx'))}
});
document.addEventListener('change',function(e){
  var tg=e.target;
  if(tg.id==='p-cat'){applyKind($('editor'),tg.value)}
  if(tg.dataset&&tg.dataset.dircat!==undefined){var dxi=+tg.dataset.dircat,dd=site.directory[dxi];if(dd){ui.dirDirty=true;dd.cat=tg.value;queueSettings();renderSec('directory')}return}
  if(tg.id==='tile-dest'){var uf=$('tile-url-fld');if(uf)uf.hidden=tg.value!=='url'}
  if(tg.id==='s-cat'){applySubmitKind($('submit'))}
  if(tg.id==='file'){onFiles([].slice.call(tg.files))}
  if(tg.dataset&&tg.dataset.nocount!==undefined){ls('malha-nocount',tg.checked?'1':null);return}
  if(tg.dataset&&tg.dataset.toggle){var pth=tg.dataset.toggle;setPath(site,pth,tg.checked);afterSet(pth);queueSettings();return}
  if(tg.dataset&&tg.dataset.model){
    var path=tg.dataset.model,l=tg.dataset.l,val=tg.value;
    if(l){var cur=getPath(site,path);if(!cur||typeof cur!=='object')setPath(site,path,{ar:cur==null?'':String(cur),en:''});getPath(site,path)[l]=val}
    else setPath(site,path,val);
    queueSettings();
    /* re-render after this event finishes: replacing the focused field inside its own change/blur event throws */
    setTimeout(function(){renderAll()},0);
  }
});
document.addEventListener('keydown',function(e){
  var tg=e.target;
  if(ui.edit&&e.key==='Enter'&&tg.hasAttribute&&tg.hasAttribute('data-line')){e.preventDefault();tg.blur();return}
  if(e.key==='Enter'&&(tg.id==='l-email'||tg.id==='l-pass')){e.preventDefault();doLogin();return}
  if(e.key==='Enter'&&tg.id==='r-email'){e.preventDefault();forgotSend();return}
  if(e.key==='Enter'&&(tg.id==='rc-1'||tg.id==='rc-2')){e.preventDefault();recoverySave();return}
  if(e.key==='Escape'&&ui.menu){ui.menu=false;root.classList.remove('menuopen')}
  if($('viewer')&&$('viewer').open){var nx=lang==='ar'?'ArrowLeft':'ArrowRight',pv=lang==='ar'?'ArrowRight':'ArrowLeft';if(e.key===nx)showPhoto(stepPhoto(ui.vi,1));else if(e.key===pv)showPhoto(stepPhoto(ui.vi,-1))}
});
document.addEventListener('paste',function(e){
  var tg=e.target;
  if(ui.edit&&tg.closest&&tg.closest('[data-path]')){
    e.preventDefault();
    var tx0=((e.clipboardData||window.clipboardData).getData('text/plain')||'');
    if(tg.closest('[data-line]'))tx0=tx0.replace(/\s+/g,' ');
    document.execCommand('insertText',false,tx0);
  }
});

/* a broken picture should never leave a hole or hide the tools around it */
document.addEventListener('error',function(e){
  var im=e.target;
  if(!im||im.tagName!=='IMG'||!im.closest)return;
  var ph=im.closest('.ph-btn');
  if(ph){var sp=document.createElement('span');sp.className='ph-vph';im.replaceWith(sp);return}
  if(im.classList.contains('fc-img')||im.classList.contains('person-img')){
    var s2=document.createElement('span');s2.className=im.classList.contains('fc-img')?'fc-ph':'person-ph';s2.innerHTML=STAR0;im.replaceWith(s2);return;
  }
  if(im.classList.contains('post-thumb'))im.remove();
},true);

function copyLink(u){
  function fallback(){toast(t('copy_fail'))}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast(t('copied'))},fallback);return}}catch(e){}
  try{var ta=document.createElement('textarea');ta.value=u;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();if(ok){toast(t('copied'));return}}catch(e){}
  fallback();
}
var deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e});
window.addEventListener('appinstalled',function(){deferredInstall=null;var b=document.querySelector('[data-act="install"]');if(b)b.remove()});
function openInstallHelp(){
  var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent||''),android=/Android/i.test(navigator.userAgent||'');
  var d=$('submit');
  d.innerHTML='<div class="dlg-in"><h3>'+t('inst_title')+'</h3><p style="font-size:1.05rem;line-height:1.8">'+esc(ios?t('inst_ios'):android?t('inst_and'):t('inst_desk'))+'</p><div class="ed-actions"><button class="primary" data-close>'+t('close')+'</button></div></div>';
  d.dir=lang==='ar'?'rtl':'ltr';openDlg(d);
}
function applyUserScale(){var v=ls('malha-fs');root.style.setProperty('--uscale',v==='1'?1.15:v==='2'?1.3:1)}
function filterStories(q){
  q=String(q||'').trim().toLowerCase();
  var rows=[].slice.call(document.querySelectorAll('[data-sec="stories"] .post-list .post[data-s],[data-sec="stories"] .people .person[data-s]')),shown=0;
  rows.forEach(function(r){var hide=!!q&&r.dataset.s.indexOf(q)<0;r.hidden=hide;if(!hide)shown++});
  var nr=$('nores');if(nr)nr.hidden=!(q&&rows.length&&!shown);
}
window.addEventListener('hashchange',function(){openFromHash()});

/* ---------- boot ---------- */
buildChrome();
applyUserScale();
lang=pickLang();
renderAll();
var dataReady=initBackend();

function reveal(){root.classList.remove('loading');root.classList.add('ready')}
if(reduce||ls('malha-noloader')==='1'){
  reveal();
}else{
  var loader=document.createElement('div');
  loader.className='loader';loader.setAttribute('aria-hidden','true');
  loader.innerHTML='<div class="loader-row"><span>'+esc(tx(site.loader.a))+'</span>'+STAR+'<span>'+esc(tx(site.loader.b))+'</span></div><div class="count" id="count">'+dig('0')+'%</div>';
  document.body.appendChild(loader);
  var lifted=false;
  var lift=function(){
    if(lifted)return;lifted=true;
    loader.classList.add('done');reveal();setTimeout(function(){loader.remove()},1300);
  };
  liftLoader=lift;
  var finish=function(){
    Promise.race([dataReady.then(function(){},function(){}),new Promise(function(r){setTimeout(r,1500)})]).then(lift,lift);
  };
  setTimeout(lift,8000);
  var run2=function(){
    var start=null,dur=2000,count=$('count');
    var tick=function(ts){
      if(start===null)start=ts;
      var p=Math.min((ts-start)/dur,1),eased=1-Math.pow(1-p,2.2);
      count.textContent=dig(Math.round(eased*100))+(lang==='ar'?'٪':'%');
      if(p<1)requestAnimationFrame(tick);else setTimeout(finish,250);
    };
    requestAnimationFrame(tick);
  };
  if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,1200)})]).then(run2);
  else run2();
}

})();
</script>
